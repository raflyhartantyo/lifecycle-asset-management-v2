                        Icon: ="Checkmark"
                        OnSelect: |
                          =
                          // ── Step 1: Show loading state ──────────────────────────────
                          UpdateContext({locIsSaving: true});
                          // ── Step 2: InTune flow (LEFT) ──────────────────────────────
                          If(
                              !IsEmpty(Registration_AttachmentControl_5.Attachments),
                              Set(
                                  varInTuneResult,
                                  InTuneFlow.Run({contentBytes: Last(Registration_AttachmentControl_5.Attachments).Value,name: Last(Registration_AttachmentControl_5.Attachments).Name})
                              )
                          );
                          // ── Step 3: CMDB flow (MIDDLE) ──────────────────────────────
                          If(
                              !IsEmpty(Registration_AttachmentControl_6.Attachments),
                              Set(
                                  varCMDBResult,
                                  InTuneFlow.Run({contentBytes: Last(Registration_AttachmentControl_6.Attachments).Value,name: Last(Registration_AttachmentControl_6.Attachments).Name})
                              )
                          );
                          // ── Step 4: Networking Device flow (RIGHT) ──────────────────
                          If(
                              !IsEmpty(Registration_AttachmentControl_7.Attachments),
                              Set(
                                  varNetworkingResult,
                                  FlowNetworkingDevice.Run({contentBytes: Last(Registration_AttachmentControl_7.Attachments).Value,name: Last(Registration_AttachmentControl_7.Attachments).Name})
                              )
                          );
                          // ── Step 5: Done ─────────────────────────────────────────────
                          UpdateContext({locIsSaving: false});
                          Notify("Files submitted! Processing will complete within 10 minutes.", NotificationType.Success);
                          Reset(Registration_AttachmentControl_5);
                          Reset(Registration_AttachmentControl_6); 
                          Reset(Registration_AttachmentControl_7);
                          UpdateContext({ShowSOUpload:false})
