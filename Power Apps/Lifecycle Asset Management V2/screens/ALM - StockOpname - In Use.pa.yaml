                        OnSelect: "=If(\r\n    !IsBlank(Registration_AttachmentControl_9.Attachments),\r\n    \r\n    UpdateContext({locIsLoading: true});\r\n    Concurrent(\r\n    ClearCollect(\r\n    colEmployeeTop,\r\n    AddColumns(\r\n        ShowColumns(\r\n            SortByColumns(\r\n                Master_Employee,\r\n                \"ID\",\r\n                SortOrder.Ascending\r\n            ),\r\n            MyID,\r\n            Display_Name,\r\n            Email,\r\n            Manager\r\n        ) As Employee,\r\n        ManagerDisplayName,\r\n        LookUp(\r\n            Master_Employee As ManagerEmployee,\r\n            ManagerEmployee.MyID = Employee.field_11,\r\n            ManagerEmployee.Display_Name\r\n        ),\r\n        ManagerEmail,\r\n        LookUp(\r\n            Master_Employee As ManagerEmployee,\r\n            ManagerEmployee.MyID = Employee.field_11,\r\n            ManagerEmployee.Email\r\n        )\r\n    )\r\n),\r\n\r\n    ClearCollect(\r\n        colEmployeeBottom,\r\n        AddColumns(\r\n        ShowColumns(\r\n            SortByColumns(\r\n                Master_Employee,\r\n                \"ID\",\r\n                SortOrder.Ascending\r\n            ),\r\n            MyID,\r\n            Display_Name,\r\n            Email,\r\n            Manager\r\n        ) As Employee,\r\n        ManagerDisplayName,\r\n        LookUp(\r\n            Master_Employee As ManagerEmployee,\r\n            ManagerEmployee.MyID = Employee.field_11,\r\n            ManagerEmployee.Display_Name\r\n        ),\r\n        ManagerEmail,\r\n        LookUp(\r\n            Master_Employee As ManagerEmployee,\r\n            ManagerEmployee.MyID = Employee.field_11,\r\n            ManagerEmployee.Email\r\n        )\r\n    )\r\n    )\r\n);\r\n\r\nClearCollect(\r\n    colEmployees,\r\n    colEmployeeTop,\r\n    colEmployeeBottom\r\n);\r\n\r\nConcurrent(\r\n    ClearCollect(\r\n        colLocations,\r\n        ShowColumns(\r\n            Master_Location,\r\n            Location_ID,\r\n            Location_Name,\r\n            PIC\r\n        )\r\n    ),\r\n\r\n    ClearCollect(\r\n        colAssetTypes,\r\n        ShowColumns(\r\n            Master_Asset_Type,\r\n            Asset_Type_ID,\r\n            Asset_Type_Name\r\n        )\r\n    )\r\n);\r\n\r\nWith(\r\n    {\r\n        Assets:\r\n            ShowColumns(\r\n                Filter(\r\n                    Master_Asset,\r\n                    Asset_Status = \"In Use\"\r\n                ),\r\n                Accounting_Asset_Code,\r\n                Asset_Name,\r\n                MYID_Asset_Owner,\r\n                Asset_Status,\r\n                Location_ID,\r\n                Asset_Type_ID,\r\n                Serial_Number,\r\n                HostName\r\n            )\r\n    },\r\n\r\n    ClearCollect(\r\n        colAssets,\r\n        DropColumns(\r\n            AddColumns(\r\n                AddColumns(\r\n                    Assets As Asset,\r\n\r\n                    EmployeeRecord,\r\n                    LookUp(\r\n                        colEmployees,\r\n                        Title = Asset.MYID_Asset_Owner\r\n                    ),\r\n\r\n                    Location,\r\n                    LookUp(\r\n                        colLocations,\r\n                        Title = Asset.Location_ID,\r\n                        field_1\r\n                    ),\r\n\r\n                    Asset_Type,\r\n                    LookUp(\r\n                        colAssetTypes,\r\n                        Asset_Type_ID = Asset.Asset_Type_ID,\r\n                        Asset_Type_Name\r\n                    ),\r\n\r\n                    PICEmployeeRecord,\r\n                    LookUp(\r\n                        colEmployees,\r\n                        Title = LookUp(\r\n                        colLocations,\r\n                        Title = Asset.Location_ID,\r\n                        PIC\r\n                    )\r\n                    )\r\n                ),\r\n\r\n                Employee_Name,\r\n                EmployeeRecord.field_6,\r\n\r\n                Employee_Email,\r\n                EmployeeRecord.field_7,\r\n\r\n                Receiver_Email,\r\n                EmployeeRecord.field_7,\r\n\r\n                PIC_Name,\r\n                PICEmployeeRecord.field_6,\r\n\r\n                PIC_Email,\r\n                PICEmployeeRecord.field_7,\r\n\r\n                Manager_Display_Name,\r\n                EmployeeRecord.ManagerDisplayName,\r\n\r\n                Manager_Email,\r\n                EmployeeRecord.ManagerEmail,\r\n\r\n                Response,\r\n                Blank(),\r\n\r\n                Comments,\r\n                Blank(),\r\n\r\n                Response_Date,\r\n                Blank(),\r\n\r\n                Response_Email,\r\n                Blank(),\r\n\r\n                Response_Type,\r\n                Blank()\r\n            ),\r\n            EmployeeRecord,\r\n            PICEmployeeRecord\r\n        )\r\n    )\r\n);\r\n    UpdateContext({timerrepeat:true});\r\n    UpdateContext({starttimer: true});\r\n    UpdateContext({ SO_In_Use_GUID: Stock_Opname_In_Use_Match.Run(\r\n\r\n        {contentBytes: Last(Registration_AttachmentControl_9.Attachments).Value, name: Last(Registration_AttachmentControl_9.Attachments).Name},\r\n        \r\n        \r\n        JSON(colAssets),\r\n\r\n        User().Email\r\n        )});\r\n    UpdateContext({GUID: SO_In_Use_GUID.guid});\r\n    Reset(Registration_AttachmentControl_9);\r\n    UpdateContext({locIsLoading: false});\r\n    UpdateContext({ShowFileUploadInUse:false});\r\n    Notify(\"Kindly wait for PowerApps to notify in teams\", NotificationType.Success),\r\n    Notify(\"Please insert CMDB file in the attachment above\", NotificationType.Error)\r\n);\r\n"
