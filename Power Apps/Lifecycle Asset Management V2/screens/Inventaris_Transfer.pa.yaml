                  FontWeight: =""
                  Height: =40
                  Icon: ="Library"
                  OnSelect: "=UpdateContext({spinnervisible:true});\n\nIf(\n    !IsBlank(colTempMovement.Parent_ID),\n\n    // ---- 1) Correlation + timestamp\n    UpdateContext({\n        ctxCorrelationId: GUID(),\n        ctxNow: Now()\n    });\n\n    // ---- 2) ORIGINAL values (from your local edit buffer)\n    UpdateContext({\n        ctxOrig_ID: colTempMovement.Title,\n        ctxOrig_Item_Name: colTempMovement.Item_Name,\n        ctxOrig_Asset_Type: colTempMovement.Category,\n        ctxOrig_Employee_MyID: colTempMovement.Employee_MYID,\n        ctxOrig_Location: colTempMovement.Location,\n        ctxOrig_Remarks: colTempMovement.Remarks,\n        ctxOrig_Quantity: colTempMovement.Quantity,\n        ctxOrig_ParentID: colTempMovement.Parent_ID\n    });\n\n    // ---- 7) Copy the full movement payload into asset_movement_history\n    // Assumes colTempMovement is a single RECORD (not a collection).\n    // Also appends a few audit fields for traceability.\n    Patch(\n        Inventories_Movement_History,\n        Defaults(Inventories_Movement_History),\n        {\n            Title:colTempMovement.Title,\n            \n            Item_Name:colTempMovement.Item_Name,\n            Category:colTempMovement.Category,\n            Employee_MYID:colTempMovement.Employee_MYID,\n            Location:colTempMovement.Location,\n            Remarks:colTempMovement.Remarks,\n            Quantity:colTempMovement.Quantity, \n            Update_Type:colTempMovement.Update_Type,\n            Updated_Date:colTempMovement.Update_Date,\n            Parent_ID:colTempMovement.Parent_ID\n    }\n    );\n\n    Patch(\n        Inventories_Movement_History,\n        Defaults(Inventories_Movement_History),\n        {\n            Title:colTempMovement.Title,\n            \n            Item_Name:colTempMovement.Item_Name,\n            Category:colTempMovement.Category,\n            Employee_MYID:colTempMovement.Employee_MYID,\n            Location:colTempMovement.Location,\n            Remarks:colTempMovement.Remarks,\n            Quantity:colTempMovement.Quantity, \n            Update_Type:\"Back to Scope\",\n            Updated_Date:Today(),\n            Parent_ID:colTempMovement.Parent_ID\n    }\n    );\n\n    // NOT YET - ADD BACK ITEM TO STOCK\n    With(\n        {\n            SourceItem: LookUp(\n                Master_Inventories,\n                Title = colTempMovement.Parent_ID\n            )\n        },\n        Patch(\n            Inventories_Movement_History,\n            Defaults(Inventories_Movement_History),\n            {\n                Title: SourceItem.Title,\n                Item_Name:SourceItem.Item_Name,\n                Category:SourceItem.Category,\n                Employee_MYID:SourceItem.Employee_MYID,\n                Location:SourceItem.Location,\n                Remarks:SourceItem.Remarks,\n                Quantity:SourceItem.Quantity, \n                Update_Type:SourceItem.Update_Type,\n                Updated_Date:SourceItem.Update_Date,\n                Parent_ID:colTempMovement.Parent_ID\n            }\n        )\n    );\n    \n    Patch(\n    Master_Inventories,\n    LookUp(\n        Master_Inventories,\n        Title = colTempMovement.Parent_ID\n    ),\n    {\n        Quantity: LookUp(\n            Master_Inventories,\n            Title = colTempMovement.Parent_ID).Quantity + colTempMovement.Quantity,\n        \n        Update_Date:Today(),\n        Update_Type:\"Add items back to stock\"\n    }\n);\n\n    \n    // 3 — UI Cleanup\nRemoveIf(Master_Inventories, Title = colTempMovement.Title);\nUpdateContext({ colTempMovement: Blank() });\nResetForm(Form1_10);\nRefresh(Master_Inventories);\n\nUpdateContext({ ShowFormMovement: false });\n\n// 4 — Notify user\nNotify(\"Data saved successfully!\", NotificationType.Success, 5000));\n\nUpdateContext({spinnervisible:false});\n"
