            - ButtonClose_Registration_21:
                Control: Button@0.0.45
                Properties:
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =40
                  Icon: ="Save"
                  OnSelect: |
                    =If(
                        Form1_6.Valid,

                        // ---- 1) Generate correlation + timestamp
                        UpdateContext({
                            ctxCorrelationId: GUID(),
                            ctxNow: Now()
                        });

                        // ---- 2) ORIGINAL values (stored in your edit buffer)
                        UpdateContext({
                            ctxOrig_Location_ID: colTempEditMasterLocation.Location_ID,
                            ctxOrig_Location_Name: colTempEditMasterLocation.Location_Name,
                            ctxOrig_Location_Address: colTempEditMasterLocation.Location_Address,
                            ctxOrig_Location_Contact: colTempEditMasterLocation.Location_Contact
                        });

                        // ---- 3) EDITED values (from form inputs)
                        UpdateContext({
                            ctxEdit_Location_ID: Location_ID_DataCard1.Update,
                            ctxEdit_Location_Name: Location_Name_DataCard1.Update,
                            ctxEdit_Location_Address: Location_Address_DataCard1.Update,
                            ctxEdit_Location_Contact: Location_Contact_DataCard1.Update,
                            ctxEdit_Location_PIC: PIC_DataCard2.Update
                        });

                        // ---- 4) Detect changed fields
                        UpdateContext({
                            ctxChangesAll: Table(
                                {
                                    FieldName: "Location_ID",
                                    OldValue: ctxOrig_Location_ID,
                                    NewValue: ctxEdit_Location_ID,
                                    Changed: ctxOrig_Location_ID <> ctxEdit_Location_ID
                                },
                                {
                                    FieldName: "Location_Name",
                                    OldValue: ctxOrig_Location_Name,
                                    NewValue: ctxEdit_Location_Name,
                                    Changed: ctxOrig_Location_Name <> ctxEdit_Location_Name
                                },
                                {
                                    FieldName: "Location_Address",
                                    OldValue: ctxOrig_Location_Address,
                                    NewValue: ctxEdit_Location_Address,
                                    Changed: ctxOrig_Location_Address <> ctxEdit_Location_Address
                                },
                                {
                                    FieldName: "Location_Contact",
                                    OldValue: ctxOrig_Location_Contact,
                                    NewValue: ctxEdit_Location_Contact,
                                    Changed: ctxOrig_Location_Contact <> ctxEdit_Location_Contact
                                }
                            )
                        });
                        UpdateContext({
                            ctxChanges: Filter(ctxChangesAll, Changed)
                        });

                        // ---- 5) Patch Master_Location
                        UpdateContext({
                            ctxPatchedItem:
                                Patch(
                                    Master_Location,
                                    LookUp(
                                        Master_Location,
                                        ID = colTempEditMasterLocation.ID
                                    ),
                                    {
                                        Location_ID: ctxEdit_Location_ID,
                                        Location_Name: ctxEdit_Location_Name,
                                        Location_Address: ctxEdit_Location_Address,
                                        Location_Contact: Text(ctxEdit_Location_Contact),
                                        PIC: ctxEdit_Location_PIC
                                    }
                                )
                        });

                        // ---- 6) Build the single "Changes" string: [FieldName:OldValue-NewValue,...]
                        // Concat doesn't support a separator param; add commas manually then strip the trailing one.
                        UpdateContext({
                            ctxChangesFlat:
                                Concat(
                                    ctxChanges,
                                    FieldName & ":" &
                                    Coalesce(Text(OldValue), "") & "-" &
                                    Coalesce(Text(NewValue), "") & ","
                                )
                        });
                        UpdateContext({
                            ctxChangesText:
                                "[" &
                                If(
                                    Len(ctxChangesFlat) > 0,
                                    Left(ctxChangesFlat, Len(ctxChangesFlat) - 1),
                                    ""
                                ) &
                                "]"
                        });
                        // ---- 7) If Patch succeeded AND there are changes, write ONE AuditLog row
                        If(
                            And(
                                !IsBlank(ctxPatchedItem.ID),
                                CountRows(ctxChanges) > 0
                            ),
                            Patch(
                                AuditLog,
                                Defaults(AuditLog),
                                {
                                    CorrelationID: ctxCorrelationId,
                                    TargetList: "Master_Location",
                                    // Use the exact internal name of your column below (ItemID vs ItemId).
                                    ItemId: ctxPatchedItem.ID,
                                    ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,
                                    ChangedOn: ctxNow,
                                    ChangeType: "Edit",
                                    Changes: ctxChangesText
                                }
                            )
                        );

                        // ---- 7) Notify + cleanup
                        If(
                            !IsBlank(ctxPatchedItem.ID),

                            // SUCCESS BRANCH
                            Notify(
                                If(
                                    CountRows(ctxChanges) = 0,
                                    "Saved (no changes detected).",
                                    "Saved and audit logged."
                                ),
                                NotificationType.Success
                            );

                            UpdateContext({ colTempEditMasterLocation: Blank() });
                            ResetForm(Form1_6);
                            UpdateContext({ ShowFormEditMasterLocation: false });
                            Refresh(Master_Location);ClearCollect(colGalleryDataMasterLocation,Master_Location),

                            // FAILURE BRANCH
                            Notify(
                                "Save failed. The item may have been modified; refresh and try again.",
                                NotificationType.Error
                            )
                        ),

                        // ---- ELSE (Form not valid)
                        Notify("Please fill all required fields before submitting.", NotificationType.Error)
                    );
                  Text: ="Save"
                  Width: =120
                  X: =Parent.Width*3/4-120
                  Y: =Form1_6.Height+Form1_6.Y+10
