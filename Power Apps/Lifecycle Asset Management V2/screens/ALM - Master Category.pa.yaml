                  Height: =40
                  Icon: ="Save"
                  OnSelect: |
                    =
                    If(
                        Form1_4.Valid,

                        // ---- 1) Correlation + timestamp
                        UpdateContext({
                            ctxCorrelationId: GUID(),
                            ctxNow: Now()
                        });

                        // ---- 2) ORIGINAL values (from your local edit buffer)
                        UpdateContext({
                            ctxOrig_Category_ID: colTempEditMasterCategory.Category_ID,
                            ctxOrig_Category_Accounting_Name: colTempEditMasterCategory.Category_Accounting_Name,
                            ctxOrig_Category_Name: colTempEditMasterCategory.Category_Name,
                            ctxOrig_Category_Description: colTempEditMasterCategory.Category_Description
                        });

                        // ---- 3) EDITED values (from cards) — trim & normalize
                        UpdateContext({
                            ctxEdit_Category_ID: Category_ID_DataCard1.Update,
                            ctxEdit_Category_Accounting_Name: Category_Accounting_Name_DataCard1.Update,
                            ctxEdit_Category_Name: Category_Name_DataCard1.Update,
                            ctxEdit_Category_Description: Category_Description_DataCard1.Update
                        });

                        // ---- 4) Build change table and keep only changed fields
                        UpdateContext({
                            ctxChangesAll: Table(
                                {
                                    FieldName: "Category_ID",
                                    OldValue: ctxOrig_Category_ID,
                                    NewValue: ctxEdit_Category_ID,
                                    Changed: ctxOrig_Category_ID <> ctxEdit_Category_ID
                                },
                                {
                                    FieldName: "Category_Accounting_Name",
                                    OldValue: ctxOrig_Category_Accounting_Name,
                                    NewValue: ctxEdit_Category_Accounting_Name,
                                    Changed: ctxOrig_Category_Accounting_Name <> ctxEdit_Category_Accounting_Name
                                },
                                {
                                    FieldName: "Category_Name",
                                    OldValue: ctxOrig_Category_Name,
                                    NewValue: ctxEdit_Category_Name,
                                    Changed: ctxOrig_Category_Name <> ctxEdit_Category_Name
                                },
                                {
                                    FieldName: "Category_Description",
                                    OldValue: ctxOrig_Category_Description,
                                    NewValue: ctxEdit_Category_Description,
                                    Changed: ctxOrig_Category_Description <> ctxEdit_Category_Description
                                }
                            )
                        });
                        UpdateContext({
                            ctxChanges: Filter(ctxChangesAll, Changed)
                        });

                        // ---- 5) Patch the master record (with ETag for concurrency)
                        UpdateContext({
                            ctxPatchedItem:
                                Patch(
                                    Master_Category,
                                    LookUp(Master_Category, ID = colTempEditMasterCategory.ID),
                                    {
                                        Category_ID: ctxEdit_Category_ID,
                                        Category_Accounting_Name: ctxEdit_Category_Accounting_Name,
                                        Category_Name: ctxEdit_Category_Name,
                                        Category_Description: ctxEdit_Category_Description
                                    }
                                )
                        });

                        // ---- 6) Build the single "Changes" string: [FieldName:OldValue-NewValue,...]
                        // Concat doesn't support a separator param; add commas manually then strip the trailing one.
                        UpdateContext({
                            ctxChangesFlat:
                                Concat(
                                    ctxChanges,
                                    FieldName & ":" &
                                    Coalesce(Text(OldValue), "") & "-" &
                                    Coalesce(Text(NewValue), "") & ","
                                )
                        });
                        UpdateContext({
                            ctxChangesText:
                                "[" &
                                If(
                                    Len(ctxChangesFlat) > 0,
                                    Left(ctxChangesFlat, Len(ctxChangesFlat) - 1),
                                    ""
                                ) &
                                "]"
                        });
                        // ---- 7) If Patch succeeded AND there are changes, write ONE AuditLog row
                        If(
                            And(
                                !IsBlank(ctxPatchedItem.ID),
                                CountRows(ctxChanges) > 0
                            ),
                            Patch(
                                AuditLog,
                                Defaults(AuditLog),
                                {
                                    CorrelationID: ctxCorrelationId,
                                    TargetList: "Master_Category",
                                    // Use the exact internal name of your column below (ItemID vs ItemId).
                                    ItemId: ctxPatchedItem.ID,
                                    ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,
                                    ChangedOn: ctxNow,
                                    ChangeType: "Edit",
                                    Changes: ctxChangesText
                                }
                            )
                        );


                        // ---- 7) Notify & clean up
                        If(
                            !IsBlank(ctxPatchedItem.ID),
                                Notify(
                                    If(CountRows(ctxChanges) = 0, "Saved (no changes detected).", "Saved and audit logged."),
                                    NotificationType.Success);            
                                UpdateContext({ colTempEditMasterCategory: Blank() });
                                ResetForm(Form1_4);
                                UpdateContext({ ShowFormEditMasterCategory: false });
                                Refresh(Master_Category);
                    ClearCollect(colGalleryDataMasterCategory,Master_Category)
                    ,
                            Notify(
                                "Save failed. The item may have been modified; refresh and try again.",
                                NotificationType.Error
                            )
                        ),
                        // ---- ELSE (Form not valid)
                        Notify("Please fill all required fields before submitting.", NotificationType.Error)
                    );
                  Text: ="Save"
                  Width: =120
                  X: =Parent.Width*3/4-120
                  Y: =Form1_4.Height+Form1_4.Y+10
