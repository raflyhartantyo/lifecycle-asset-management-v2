            - ButtonClose_Registration_27:
                Control: Button@0.0.45
                Properties:
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =40
                  Icon: ="Save"
                  OnSelect: "=SubmitForm(Form1_9);\n\nIf(\n    !IsBlank(Form1_9.LastSubmit),\n\n    // ---- 1) Correlation + timestamp\n    UpdateContext({\n        ctxCorrelationId: GUID(),\n        ctxNow: Now()\n    });\n\n    // ---- 2) ORIGINAL values (from your local edit buffer)\n    UpdateContext({\n        ctxOrig_Asset_ID: colTempMovement.Asset_ID,\n        ctxOrig_Location_ID: colTempMovement.Location_ID,\n        ctxOrig_Asset_Owner_MyID: colTempMovement.MYID_Asset_Owner,\n        ctxOrig_Asset_Condition: colTempMovement.Asset_Condition,\n        ctxOrig_Asset_Status: colTempMovement.Asset_Status\n    });\n\n    // ---- 3) EDITED values (from cards) — normalize\n    UpdateContext({\n        ctxEdit_Location_ID: Location_ID_DataCard2.Update,\n        ctxEdit_Asset_Owner_MyID: MYID_Asset_Owner_DataCard1.Update,\n        ctxEdit_Asset_Condition: Asset_Condition_DataCard1.Update,\n        ctxEdit_Asset_Status: Asset_Status_DataCard1.Update\n    });\n\n    // ---- 4) Build change table and keep only changed fields\n    UpdateContext({\n        ctxChangesAll: Table(\n            {\n                FieldName: \"Location_ID\",\n                OldValue: ctxOrig_Location_ID,\n                NewValue: ctxEdit_Location_ID,\n                Changed: ctxOrig_Location_ID <> ctxEdit_Location_ID\n            },\n            {\n                FieldName: \"MYID_Asset_Owner\",\n                OldValue: ctxOrig_Asset_Owner_MyID,\n                NewValue: ctxEdit_Asset_Owner_MyID,\n                Changed: ctxOrig_Asset_Owner_MyID <> ctxEdit_Asset_Owner_MyID\n            },\n            {\n                FieldName: \"Asset_Condition\",\n                OldValue: ctxOrig_Asset_Condition,\n                NewValue: ctxEdit_Asset_Condition,\n                Changed: ctxOrig_Asset_Condition <> ctxEdit_Asset_Condition\n            },\n            {\n                FieldName: \"Asset_Status\",\n                OldValue: ctxOrig_Asset_Status,\n                NewValue: ctxEdit_Asset_Status,\n                Changed: ctxOrig_Asset_Status <> ctxEdit_Asset_Status\n            }\n        )\n    });\n    UpdateContext({\n        ctxChanges: Filter(ctxChangesAll, Changed)\n    });\n\n    // ---- 5) Flatten changes to one string: [Field:Old-New,...]\n    UpdateContext({\n        ctxChangesFlat:\n            Concat(\n                ctxChanges,\n                FieldName & \":\" &\n                Coalesce(Text(OldValue), \"\") & \"-\" &\n                Coalesce(Text(NewValue), \"\") & \",\"\n            )\n    });\n    UpdateContext({\n        ctxChangesText:\n            \"[\" &\n            If(\n                Len(ctxChangesFlat) > 0,\n                Left(ctxChangesFlat, Len(ctxChangesFlat) - 1),\n                \"\"\n            ) &\n            \"]\"\n    });\n\n    // ---- 6) If there are changes, write ONE AuditLog row\n    If(\n        CountRows(ctxChanges) > 0,\n        Patch(\n            AuditLog,\n            Defaults(AuditLog),\n            {\n                CorrelationID: ctxCorrelationId,\n                TargetList: \"Master_Asset\",\n                ItemId: ctxOrig_Asset_ID, // change to ItemID if your column's display/internal name is ItemID\n                ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,\n                ChangedOn: ctxNow,\n                ChangeType: \"Movement\",\n                Changes: ctxChangesText\n            }\n        )\n    );\n\n    // ---- 7) Copy the full movement payload into asset_movement_history\n    // Assumes colTempMovement is a single RECORD (not a collection).\n    // Also appends a few audit fields for traceability.\n    Patch(\n        Asset_Movement_History,\n        Defaults(Asset_Movement_History),\n        {\n            Asset_ID:colTempMovement.Asset_ID,\n            \n            Organization_ID:colTempMovement.Organization_ID,\n            Accounting_Asset_Code:colTempMovement.Accounting_Asset_Code,\n            Asset_Name:colTempMovement.Asset_Name,\n            MYID_Asset_Owner:colTempMovement.MYID_Asset_Owner, \n            Asset_Condition: colTempMovement.Asset_Condition, \n            Asset_Status:colTempMovement.Asset_Status, \n            Location_ID:colTempMovement.Location_ID,\n            Function_ID:colTempMovement.Function_ID,\n            Updated_Date: colTempMovement.Updated_Date,\n            Update_Type:colTempMovement.Update_Type,\n            Remarks:colTempMovement.Remarks\n    }\n    )\n);\n\n// 3 — UI Cleanup\nUpdateContext({spinnervisible:true});\nUpdateContext({ colTempMovement: Blank() });\nResetForm(Form1_9);\nRefresh(Master_Asset);\n\nConcurrent(\n    ClearCollect(Master_Location_Cache, Master_Location),\n    ClearCollect(Master_Asset_Type_Cache, Master_Asset_Type),\n    ClearCollect(Master_Category_Cache, Master_Category),\n    ClearCollect(Master_Employee_Cache, Filter(Master_Employee, Identity_Status = \"Active\"))\n);\n\nConcurrent(\n    ClearCollect(\n         colCarsChunk1,\n         Sort(Master_Asset, 'ID Number',SortOrder.Ascending)\n     ),\n     ClearCollect(\n         colCarsChunk2,\n         Sort(Master_Asset, 'ID Number',SortOrder.Descending)\n     )\n);\n\nClearCollect(\n    Master_Asset_Data,\n    AddColumns(colCarsChunk1,\n    Location_Name, With({_locID: ThisRecord.Location_ID},\n        LookUp(Master_Location_Cache, Location_ID = _locID, Location_Name)),\n    Asset_Owner, With({_MYID: ThisRecord.MYID_Asset_Owner},\n        LookUp(Master_Employee_Cache, MyID = _MYID, Display_Name)),\n    Business_Owner, With({_MYID: ThisRecord.MYID_Business_Owner},\n        LookUp(Master_Employee_Cache, MyID = _MYID, Display_Name)),\n    Asset_Type_Name, With({_typeID: ThisRecord.Asset_Type_ID},\n        LookUp(Master_Asset_Type_Cache, Asset_Type_ID = _typeID, Asset_Type_Name)),\n    Category_Name, With({_catID: ThisRecord.Category_ID},\n        LookUp(Master_Category_Cache, Category_ID = _catID, Category_Name))\n),\n    AddColumns(\n        Filter(colCarsChunk2, Not(ID in colCarsChunk1.ID)),\n        Location_Name, With({_locID: ThisRecord.Location_ID},\n            LookUp(Master_Location_Cache, Location_ID = _locID, Location_Name)),\n        Asset_Owner, With({_MYID: ThisRecord.MYID_Asset_Owner},\n            LookUp(Master_Employee_Cache, MyID = _MYID, Display_Name)),\n        Business_Owner, With({_MYID: ThisRecord.MYID_Business_Owner},\n            LookUp(Master_Employee_Cache, MyID = _MYID, Display_Name)),\n        Asset_Type_Name, With({_typeID: ThisRecord.Asset_Type_ID},\n            LookUp(Master_Asset_Type_Cache, Asset_Type_ID = _typeID, Asset_Type_Name)),\n        Category_Name, With({_catID: ThisRecord.Category_ID},\n            LookUp(Master_Category_Cache, Category_ID = _catID, Category_Name))\n    )\n);\n\nClear(colCarsChunk1);\nClear(colCarsChunk2);\n\nClearCollect(\n    ColLocationValues_MasterAsset,\n    Sort(\n        Distinct(Master_Asset_Data, Location_Name),\n        Value\n    )\n);\n\nClearCollect(\n    ColAssetOwnerValues_MasterAsset,\n    Sort(\n        Distinct(Master_Asset_Data, Asset_Owner),\n        Value\n    )\n);\n\nClearCollect(\n    ColAssetTypeValues_MasterAsset,\n    Sort(\n        Distinct(Master_Asset_Data, Asset_Type_Name),\n        Value\n    )\n);\n\nClearCollect(\n    ColBusinessOwnerValues_MasterAsset,\n    Sort(\n        Distinct(Master_Asset_Data, Business_Owner),\n        Value\n    )\n);\n\nClearCollect(\n    ColCategoryValues_MasterAsset,\n    Sort(\n        Distinct(Master_Asset_Data, Category_Name),\n        Value\n    )\n);\n\nReset(ColumnValueMasterAsset_9);\n\n\nUpdateContext({ ShowFormMovement: false });\nUpdateContext({spinnervisible:false});\n\n// 4 — Notify user\nNotify(\"Data saved successfully!\", NotificationType.Success, 5000);"
