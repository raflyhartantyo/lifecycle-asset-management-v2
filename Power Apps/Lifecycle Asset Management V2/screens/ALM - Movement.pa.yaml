Screens:
  ALM - Movement:
    Properties:
      Fill: =Color.WhiteSmoke
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnHidden: |-
        =UpdateContext({ShowMovementData: false});
        UpdateContext({ShowMovementTrigger: true});
      OnVisible: =UpdateContext({ShowMovementTrigger:true})
    Children:
      - HeaderContainer_AssetMaster_3:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            BorderStyle: =BorderStyle.None
            Height: =75
            Width: =1352
            X: =14
            Y: =21
          Children:
            - Header_AssetMaster_3:
                Control: Header@0.0.44
                Properties:
                  BasePaletteColor: =RGBA(5, 102, 178, 1)
                  BorderStyle: =BorderStyle.None
                  Fill: =RGBA(180, 214, 250, 1)
                  Logo: ='Zurich Logo'
                  LogoTooltip: ="Zurich Indonesia"
                  Width: =1352
            - ButtonNew_CategoryMaster_13:
                Control: Button@0.0.45
                Properties:
                  BasePaletteColor: =Color.Orange
                  Height: =50
                  Icon: ="ArrowClockwise"
                  OnSelect: |-
                    =
                    Concurrent(
                        ClearCollect(Master_Location_Cache, Master_Location),
                        ClearCollect(Master_Asset_Type_Cache, Master_Asset_Type),
                        ClearCollect(Master_Category_Cache, Master_Category),
                        ClearCollect(Master_Employee_Cache, Filter(Master_Employee, Identity_Status = "Active"))
                    );

                    Concurrent(
                        ClearCollect(
                             colCarsChunk1,
                             Sort(Master_Asset, 'ID Number',SortOrder.Ascending)
                         ),
                         ClearCollect(
                             colCarsChunk2,
                             Sort(Master_Asset, 'ID Number',SortOrder.Descending)
                         )
                    );

                    ClearCollect(
                        Master_Asset_Data,
                        AddColumns(colCarsChunk1,
                        Location_Name, With({_locID: ThisRecord.Location_ID},
                            LookUp(Master_Location_Cache, Location_ID = _locID, Location_Name)),
                        Asset_Owner, With({_MYID: ThisRecord.MYID_Asset_Owner},
                            LookUp(Master_Employee_Cache, MyID = _MYID, Display_Name)),
                        Business_Owner, With({_MYID: ThisRecord.MYID_Business_Owner},
                            LookUp(Master_Employee_Cache, MyID = _MYID, Display_Name)),
                        Asset_Type_Name, With({_typeID: ThisRecord.Asset_Type_ID},
                            LookUp(Master_Asset_Type_Cache, Asset_Type_ID = _typeID, Asset_Type_Name)),
                        Category_Name, With({_catID: ThisRecord.Category_ID},
                            LookUp(Master_Category_Cache, Category_ID = _catID, Category_Name))
                    ),
                        AddColumns(
                            Filter(colCarsChunk2, Not(ID in colCarsChunk1.ID)),
                            Location_Name, With({_locID: ThisRecord.Location_ID},
                                LookUp(Master_Location_Cache, Location_ID = _locID, Location_Name)),
                            Asset_Owner, With({_MYID: ThisRecord.MYID_Asset_Owner},
                                LookUp(Master_Employee_Cache, MyID = _MYID, Display_Name)),
                            Business_Owner, With({_MYID: ThisRecord.MYID_Business_Owner},
                                LookUp(Master_Employee_Cache, MyID = _MYID, Display_Name)),
                            Asset_Type_Name, With({_typeID: ThisRecord.Asset_Type_ID},
                                LookUp(Master_Asset_Type_Cache, Asset_Type_ID = _typeID, Asset_Type_Name)),
                            Category_Name, With({_catID: ThisRecord.Category_ID},
                                LookUp(Master_Category_Cache, Category_ID = _catID, Category_Name))
                        )
                    );

                    Clear(colCarsChunk1);
                    Clear(colCarsChunk2);

                    ClearCollect(
                        ColLocationValues_MasterAsset,
                        Sort(
                            Distinct(Master_Asset_Data, Location_Name),
                            Value
                        )
                    );

                    ClearCollect(
                        ColAssetOwnerValues_MasterAsset,
                        Sort(
                            Distinct(Master_Asset_Data, Asset_Owner),
                            Value
                        )
                    );

                    ClearCollect(
                        ColAssetTypeValues_MasterAsset,
                        Sort(
                            Distinct(Master_Asset_Data, Asset_Type_Name),
                            Value
                        )
                    );

                    ClearCollect(
                        ColBusinessOwnerValues_MasterAsset,
                        Sort(
                            Distinct(Master_Asset_Data, Business_Owner),
                            Value
                        )
                    );

                    ClearCollect(
                        ColCategoryValues_MasterAsset,
                        Sort(
                            Distinct(Master_Asset_Data, Category_Name),
                            Value
                        )
                    );

                    UpdateContext({ShowMovementData: true});
                    UpdateContext({Select_Check: false});

                    Collect(
                            colMovementList,
                            First(
                                Table(Master_Asset_Data)
                            )
                        );

                    Clear(colMovementList)
                  Text: ="Load Data"
                  Width: =116
                  X: =Search_AssetMaster_3.X-Self.Width - 40
                  Y: =(HeaderContainer_AssetMaster_3.Height-Self.Height)/2
            - Icon15_8:
