                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  TemplateFill: |-
                    =If(
                        ThisItem.IsSelected,
                        RGBA(160, 200, 240, 1),
                        If(
                            !IsBlank(
                                LookUp(
                                    colMovementList,
                                    Accounting_Asset_Code = ThisItem.Accounting_Asset_Code
                                )
                            ),
                            Color.LawnGreen,
                            Color.Transparent
                        )
                    )
                  TemplateSize: =50
                  Width: =ColumnNameMasterAsset_9.Width + NextArrow2_8.Width
                  X: =Parent.X
                  Y: =Parent.Height-Self.Height
                Children:
                  - NextArrow2_8:
                      Control: Classic/Icon@2.5.0
                      Properties:
                        AccessibleLabel: =Self.Tooltip
                        BorderColor: =RGBA(0, 0, 0, 1)
                        Color: =RGBA(166, 166, 166, 1)
                        DisabledBorderColor: =RGBA(56, 56, 56, 1)
                        DisabledColor: =RGBA(119, 119, 119, 1)
                        Fill: =Color.WhiteSmoke
                        Height: =50
                        Icon: |-
                          =If(
                              !IsBlank(LookUp(colMovementList, Accounting_Asset_Code = ThisItem.Accounting_Asset_Code)),
                              Icon.Cancel,   // item already selected → show minus
                              Icon.Add       // item not selected → show plus
                          )
                        OnSelect: |+
                          =If(
                              IsBlank(
                                  LookUp(
                                      colMovementList,
                                      Accounting_Asset_Code = ThisItem.Accounting_Asset_Code
                                  )
                              ),
                              // Not in collection → add ThisItem + extra empty columns
                              Collect(
                                  colMovementList,
                                  First(
                                      Table(ThisItem)
                                  )
                              ),
                              // Already in collection → remove by key
