                              Y: =DataCardKey100.Y
            - Button2:
                Control: ModernButton@1.0.0
                Properties:
                  BasePaletteColor: =Color.Red
                  Icon: ="Dismiss"
                  OnSelect: |+
                    =UpdateContext({colTempEditMasterAsset : Blank()});
                    UpdateContext({ShowFormEditMasterAsset: false})
                  Text: ="Cancel"
                  Visible: =Parent.Visible
                  X: =(Form1.Width - (2 * Self.Width)) / 3
                  Y: =Form1.Y + Form1.Height - 50
            - Button2_1:
                Control: ModernButton@1.0.0
                Properties:
                  Icon: ="Save"
                  OnSelect: |-
                    =SubmitForm(Form1);
                    // 3 — UI Cleanup
                    UpdateContext({ spinnervisible: true });
                    UpdateContext({colTempEditMasterAsset : Blank()});


                    Refresh(Master_Asset);

                    Concurrent(
                        ClearCollect(Master_Location_Cache, Master_Location),
                        ClearCollect(Master_Asset_Type_Cache, Master_Asset_Type),
                        ClearCollect(Master_Category_Cache, Master_Category)
                    );

                    Concurrent(
                        ClearCollect(
                            colCarsChunk1,
                            Sort(Master_Asset, 'ID Number', SortOrder.Ascending)
                        ),
                        ClearCollect(
                            colCarsChunk2,
                            Sort(Master_Asset, 'ID Number', SortOrder.Descending)
                        )
                    );

                    // Rebuild main collection
                    Clear(Master_Asset_Data);
                    ClearCollect(
                        Master_Asset_Data,
                        AddColumns(
                            colCarsChunk1,
                            Location_Name,
                            With(
                                { _locID: ThisRecord.Location_ID },
                                LookUp(Master_Location_Cache, Location_ID = _locID, Location_Name)
                            ),
                            Asset_Type_Name,
                            With(
                                { _typeID: ThisRecord.Asset_Type_ID },
                                LookUp(Master_Asset_Type_Cache, Asset_Type_ID = _typeID, Asset_Type_Name)
                            ),
                            Category_Name,
                            With(
                                { _catID: ThisRecord.Category_ID },
                                LookUp(Master_Category_Cache, Category_ID = _catID, Category_Name)
                            )
                        ),
                        AddColumns(
                            Filter(colCarsChunk2, Not(ID in colCarsChunk1.ID)),
                            Location_Name,
                            With(
                                { _locID: ThisRecord.Location_ID },
                                LookUp(Master_Location_Cache, Location_ID = _locID, Location_Name)
                            ),
                            Asset_Type_Name,
                            With(
                                { _typeID: ThisRecord.Asset_Type_ID },
                                LookUp(Master_Asset_Type_Cache, Asset_Type_ID = _typeID, Asset_Type_Name)
                            ),
                            Category_Name,
                            With(
                                { _catID: ThisRecord.Category_ID },
                                LookUp(Master_Category_Cache, Category_ID = _catID, Category_Name)
                            )
                        )
                    );

                    // Cleanup temp collections
                    Clear(colCarsChunk1);
                    Clear(colCarsChunk2);
                    ResetForm(Form1);
                    // Hide spinner
                    UpdateContext({ShowFormEditMasterAsset: false});
                    UpdateContext({ spinnervisible: false });

                    // 4 — Notify user
                    Notify("Data saved successfully!", NotificationType.Success, 5000);
                  Text: ="Save"
                  Visible: =Parent.Visible
                  X: =2 * (Form1.Width - (2 * Button2.Width)) / 3 + Button2.Width
                  Y: =Form1.Y + Form1.Height - 50
