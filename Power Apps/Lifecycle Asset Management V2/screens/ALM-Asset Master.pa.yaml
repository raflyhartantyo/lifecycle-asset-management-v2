      - Icon11:
          Control: ModernIcon@1.1.1
          Properties:
            BorderStyle: =BorderStyle.None
            Icon: ="ArrowImport"
            IconColor: =Color.DarkBlue
            IconStyle: =IconStyle.Filled
            OnSelect: |-
              =If(
                  !IsBlank(varLink),

                  /* Second click */
                  Launch(varLink);

                  /* Optional: clear so next click exports again */
                  Set(varLink, Blank()),

                  /* First click */
                  UpdateContext({spinnervisible:true});

                  Set(
                      varLink,
                      ExportData.Run(
                          JSON(
                              ShowColumns(
                                  ColumnValueMasterAsset.AllItems,
                                  Asset_ID,
                                  Organization_ID,
                                  Accounting_Asset_Code,
                                  Asset_Name,
                                  Asset_Owner,
                                  Business_Owner,
                                  Asset_Condition,
                                  Asset_Status,
                                  Asset_Sub_Status,
                                  Location_Name,
                                  Asset_Type_Name,
                                  Category_Name,
                                  HostName,
                                  Serial_Number,
                                  Environment,
                                  Merk,
                                  Sub_Merk,
                                  Lifespan,
                                  Arrival_Date,
                                  Purchasing_Price,
                                  Function_ID,
                                  Supplier,
                                  EndOfSupport,
                                  Remarks
                              ),
                              JSONFormat.Compact
                          )
                      ).fileurl
                  );

                  UpdateContext({spinnervisible:false});

                  Notify(
                      "Export completed. Click the button again to open the file.",
                      NotificationType.Success
                  )
              )
            Rotation: =90
            X: =AssetDataContainer.Width + AssetDataContainer.X - Self.Width - 5
            Y: =AssetDataContainer.Y - Self.Height - 3
