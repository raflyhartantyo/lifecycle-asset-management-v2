            - ButtonClose_Registration_23:
                Control: Button@0.0.45
                Properties:
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =40
                  Icon: ="Save"
                  OnSelect: |
                    =If(
                        Form1_7.Valid,

                        // ---- 1) Correlation + timestamp
                        UpdateContext({
                            ctxCorrelationId: GUID(),
                            ctxNow: Now()
                        });

                        // ---- 2) ORIGINAL values (from your local edit buffer)
                        UpdateContext({
                            ctxOrig_Function_ID: colTempEditMasterFunction.Function_ID,
                            ctxOrig_Function_Name: colTempEditMasterFunction.Function_Name,
                            ctxOrig_Organization_ID: colTempEditMasterFunction.Organization_ID
                        });

                        // ---- 3) EDITED values (from cards)
                        UpdateContext({
                            ctxEdit_Function_ID: Function_ID_DataCard3.Update,
                            ctxEdit_Function_Name: Function_Name_DataCard1.Update,
                            ctxEdit_Organization_ID: Organization_ID_DataCard1.Update
                        });

                        // ---- 4) Build change table and keep only changed fields
                        UpdateContext({
                            ctxChangesAll: Table(
                                {
                                    FieldName: "Function_ID",
                                    OldValue: ctxOrig_Function_ID,
                                    NewValue: ctxEdit_Function_ID,
                                    Changed: ctxOrig_Function_ID <> ctxEdit_Function_ID
                                },
                                {
                                    FieldName: "Function_Name",
                                    OldValue: ctxOrig_Function_Name,
                                    NewValue: ctxEdit_Function_Name,
                                    Changed: ctxOrig_Function_Name <> ctxEdit_Function_Name
                                },
                                {
                                    FieldName: "Organization_ID",
                                    OldValue: ctxOrig_Organization_ID,
                                    NewValue: ctxEdit_Organization_ID,
                                    Changed: ctxOrig_Organization_ID <> ctxEdit_Organization_ID
                                }
                            )
                        });
                        UpdateContext({
                            ctxChanges: Filter(ctxChangesAll, Changed)
                        });

                        // ---- 5) Patch the master record (optionally add ETag for concurrency)
                        UpdateContext({
                            ctxPatchedItem:
                                Patch(
                                    Master_Function,
                                    LookUp(Master_Function, ID = colTempEditMasterFunction.ID),
                                    {
                                        Function_ID: ctxEdit_Function_ID,
                                        Function_Name: ctxEdit_Function_Name,
                                        Organization_ID: ctxEdit_Organization_ID
                                    }
                                )
                        });

                        // ---- 6) If Patch succeeded, log one row per changed field
                        // ---- 6) Build the single "Changes" string: [FieldName:OldValue-NewValue,...]
                        // Concat doesn't support a separator param; add commas manually then strip the trailing one.
                        UpdateContext({
                            ctxChangesFlat:
                                Concat(
                                    ctxChanges,
                                    FieldName & ":" &
                                    Coalesce(Text(OldValue), "") & "-" &
                                    Coalesce(Text(NewValue), "") & ","
                                )
                        });
                        UpdateContext({
                            ctxChangesText:
                                "[" &
                                If(
                                    Len(ctxChangesFlat) > 0,
                                    Left(ctxChangesFlat, Len(ctxChangesFlat) - 1),
                                    ""
                                ) &
                                "]"
                        });
                        // ---- 7) If Patch succeeded AND there are changes, write ONE AuditLog row
                        If(
                            And(
                                !IsBlank(ctxPatchedItem.ID),
                                CountRows(ctxChanges) > 0
                            ),
                            Patch(
                                AuditLog,
                                Defaults(AuditLog),
                                {
                                    CorrelationID: ctxCorrelationId,
                                    TargetList: "Master_Function",
                                    // Use the exact internal name of your column below (ItemID vs ItemId).
                                    ItemId: ctxPatchedItem.ID,
                                    ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,
                                    ChangedOn: ctxNow,
                                    ChangeType: "Edit",
                                    Changes: ctxChangesText
                                }
                            )
                        );

                        // ---- 7) Notify & clean up
                        If(
                            !IsBlank(ctxPatchedItem.ID),
                            Notify(
                                If(CountRows(ctxChanges) = 0, "Saved (no changes detected).", "Saved and audit logged."),
                                NotificationType.Success
                            );
                            UpdateContext({ colTempEditMasterFunction: Blank() });
                            ResetForm(Form1_7);
                            UpdateContext({ ShowFormEditMasterFunction: false });
                            Refresh(Master_Function);ClearCollect(colGalleryDataMasterFunction,Master_Function),
                            Notify(
                                "Save failed. The item may have been modified; refresh and try again.",
                                NotificationType.Error
                            )
                        ),

                        // ---- ELSE (Form not valid)
                        Notify("Please fill all required fields before submitting.", NotificationType.Error)
                    );
                  Text: ="Save"
                  Width: =120
                  X: =Parent.Width*3/4-120
                  Y: =Form1_7.Height+Form1_7.Y+10
