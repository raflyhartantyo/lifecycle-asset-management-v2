Screens:
  1_LandingPage:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Img_LP:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =767
            Image: ='GettyImages-1307649344'
            Transparency: =0.2
            Width: =1366
      - Ctr_LP:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(0,51,102, 0.3)
            Height: =Parent.Height - Hdr_LP.Height
            Width: =Parent.Width
            Y: =Hdr_LP.Height
          Children:
            - Txt_Title_LP:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  AutoHeight: =true
                  Font: =Font.Verdana
                  FontColor: =Color.White
                  Height: =200
                  Size: =Min(72, Parent.Width * 0.5)
                  Text: |-
                    ="Asset Lifecycle 
                    Management"
                  VerticalAlign: =VerticalAlign.Middle
                  Weight: ='TextCanvas.Weight'.Bold
                  Width: =Parent.Width
                  Y: =150
            - Txt_Subtitle_LP:
                Control: Text@0.0.51
                Properties:
                  Align: ='TextCanvas.Align'.Center
                  Font: =Font.Verdana
                  FontColor: =RGBA(255, 255, 255, 1)
                  Height: =100
                  Size: =Min(28, Parent.Width * 0.2)
                  Text: =Concatenate("Welcome ", User().FullName)
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =600
                  X: =Btn_Start_LP.X+Btn_Start_LP.Width/2 - Self.Width/2
                  Y: |+
                    =Btn_Start_LP.Y-Self.Height
            - Btn_Start_LP:
                Control: Button@0.0.45
                Properties:
                  Align: =Align.Center
                  BasePaletteColor: =RGBA(56, 96, 178, 1)
                  BorderColor: =Color.Transparent
                  DisplayMode: =If(!IsBlank(LookUp(Acces_Matrix,Title=LookUp(Master_Employee,Email=User().Email,MyID))),DisplayMode.Edit,DisplayMode.Disabled)
                  FontSize: =24
                  FontWeight: =FontWeight.Semibold
                  Height: =56
                  OnSelect: |-
                    =If(
                        LookUp(Acces_Matrix, Title = LookUp(Master_Employee,Email = User().Email).MyID, Asset_Management) = true,
                        UpdateContext({Asset_Management: true})
                    );
                    If(
                        LookUp(Acces_Matrix, Title = LookUp(Master_Employee,Email = User().Email).MyID, Inventories_Management) = true,
                        UpdateContext({Inventories_Management: true})
                    );

                    If(
                        Asset_Management && Inventories_Management,
                        Navigate('Home Page_Asset_Inventory',ScreenTransition.Fade),
                        Inventories_Management,
                        Navigate(Inventaris,ScreenTransition.Fade),
                        Asset_Management,
                        Navigate('2_HomePage',ScreenTransition.Fade),
                        Notify("Sorry, you don't have access", NotificationType.Error, 5000)
                    )
                  Text: ="Start"
                  VerticalAlign: =VerticalAlign.Middle
                  Width: =220
                  X: =(Parent.Width - Self.Width) / 2
                  Y: =Parent.Height/2 + Hdr_LP.Height
      - Hdr_LP:
          Control: Header@0.0.44
          Properties:
            Fill: =RGBA(180, 214, 250, 1)
            Logo: ='Zurich Logo'
            LogoTooltip: ="Zurich"
            Title: ="Asset Lifecycle Management "
