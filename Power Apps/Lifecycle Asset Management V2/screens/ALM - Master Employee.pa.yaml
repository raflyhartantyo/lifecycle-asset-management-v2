            - ButtonClose_Registration_19:
                Control: Button@0.0.45
                Properties:
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =40
                  Icon: ="Save"
                  OnSelect: "=If(\n    Form1_5.Valid,\n\n    // Step 1 — Global context for this save run\n    UpdateContext({\n        ctxUserDisplay: User().FullName,\n        ctxUserEmail: Lower(User().Email),\n        ctxNow: Now()\n    });\n\n    // Step 2 — Create NEW Master_Employee record with audit logging\n    With(\n        { localCorrelationId: GUID() },\n\n        // ---- 1) Create the master record\n        With(\n            {\n                newItem:\n                    Patch(\n                        Master_Employee,\n                        Defaults(Master_Employee),\n                        {\n                            MyID: MyID_DataCard1.Update,\n                            Email: Email_DataCard2.Update,\n                            Display_Name: Display_Name_DataCard1.Update,\n                            Employee_Type: Employee_Type_DataCard4.Update,\n                            Department: Department_DataCard2.Update,\n                            Manager: Manager_DataCard2.Update,\n\n                            // Name breakdown\n                            First_Name:\n                                Trim(\n                                    Concat(\n                                        FirstN(\n                                            Split(Trim(Display_Name_DataCard1.Update), \" \"),\n                                            CountRows(Split(Trim(Display_Name_DataCard1.Update), \" \")) - 1\n                                        ),\n                                        ThisRecord.Value & \" \"\n                                    )\n                                ),\n                            Last_Name:\n                                Last(\n                                    Split(Trim(Display_Name_DataCard1.Update), \" \")\n                                ).Value,\n\n                            Identity_Status: \"Active\",\n                            Remarks: \"TEMP\"\n                        }\n                    )\n            },\n\n            // ---- 2) Build per-record change table\n            With(\n                {\n                    changeTable:\n                        Table(\n                            {\n                                FieldName: \"MyID\",\n                                OldValue: \"\",\n                                NewValue: MyID_DataCard1.Update\n                            },\n                            {\n                                FieldName: \"Email\",\n                                OldValue: \"\",\n                                NewValue: Email_DataCard2.Update\n                            },\n                            {\n                                FieldName: \"Display_Name\",\n                                OldValue: \"\",\n                                NewValue: Display_Name_DataCard1.Update\n                            },\n                            {\n                                FieldName: \"Employee_Type\",\n                                OldValue: \"\",\n                                NewValue: Employee_Type_DataCard4.Update\n                            },\n                            {\n                                FieldName: \"Department\",\n                                OldValue: \"\",\n                                NewValue: Department_DataCard2.Update\n                            },\n                            {\n                                FieldName: \"Manager\",\n                                OldValue: \"\",\n                                NewValue: Manager_DataCard2.Update\n                            },\n                            {\n                                FieldName: \"First_Name\",\n                                OldValue: \"\",\n                                NewValue:\n                                    Trim(\n                                        Concat(\n                                            FirstN(\n                                                Split(Trim(Display_Name_DataCard1.Update), \" \"),\n                                                CountRows(Split(Trim(Display_Name_DataCard1.Update), \" \")) - 1\n                                            ),\n                                            ThisRecord.Value & \" \"\n                                        )\n                                    )\n                            },\n                            {\n                                FieldName: \"Last_Name\",\n                                OldValue: \"\",\n                                NewValue:\n                                    Last(\n                                        Split(Trim(Display_Name_DataCard1.Update), \" \")\n                                    ).Value\n                            },\n                            {\n                                FieldName: \"Identity_Status\",\n                                OldValue: \"\",\n                                NewValue: \"Active\"\n                            }\n                        )\n                },\n                \n// ---- 3a) WITH #1 — build changesFlat once\n                With(\n                    {\n                        changesFlat:\n                            Concat(\n                                changeTable,\n                                FieldName & \":\" &\n                                Coalesce(Text(OldValue), \"\") & \"-\" &\n                                Coalesce(Text(NewValue), \"\") & \",\"\n                            )\n                    },\n\n                    // ---- 3b) WITH #2 — build changesText from changesFlat\n                    With(\n                        {\n                            changesText:\n                                \"[\" &\n                                If(\n                                    Len(changesFlat) > 0,\n                                    Left(changesFlat, Len(changesFlat) - 1),\n                                    \"\"\n                                ) &\n                                \"]\"\n                        },\n\n                        // ---- 4) Write ONE row to AuditLog per created item\n                        If(\n                            !IsBlank(newItem.ID),\n                            Patch(\n                                AuditLog,\n                                Defaults(AuditLog),\n                                {\n                                    CorrelationID: localCorrelationId,\n                                    TargetList: \"Master_Employee\",\n                                    ItemId: newItem.ID, // change to ItemID if that's your column name\n                                    ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,\n                                    ChangedOn: ctxNow,\n                                    ChangeType: \"Created\",\n                                    Changes: changesText\n                                }\n                            )\n                        )\n                    )\n                )\n            )\n        )\n    );\n\n    // ---- 4) Post-save UX\n    ResetForm(Form1_5);\n    UpdateContext({ ShowFormEditMasterEmployee: false });\n    Notify(\"Data saved and audit logged!\", NotificationType.Success);\n\n    ,\n\n    // ELSE branch: form invalid\n    Notify(\"Please fill all required fields before submitting.\", NotificationType.Error)\n);\n"
                  Text: ="Save"
                  Width: =120
                  X: =Parent.Width*3/4-120
                  Y: =Form1_5.Height+Form1_5.Y+10
