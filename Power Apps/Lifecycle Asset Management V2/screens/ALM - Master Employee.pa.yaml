                            colGalleryDataMasterEmployee,
                            Filter(
                                colGalleryDataMasterEmployee,

                                // -------------------------
                                // Text columns (partial match)
                                // -------------------------
                                q in MyID ||
                                q in GADID ||
                                q in APUID ||
                                q in First_Name ||
                                q in Middle_Name ||
                                q in Last_Name ||
                                q in Display_Name ||
                                q in Email ||
                                q in 'Title (field_8)'||
                                q in Company ||
                                q in Manager ||
                                q in City ||
                                q in Employee_Type ||
                                q in Department ||
                                q in Identity_Status ||
                                q in Remarks ||

                                // -------------------------
                                // Date columns (exact date match)
                                // -------------------------
                                (
                                    !IsBlank(d) &&
                                    (
                                        DateValue(Start_Date) = d ||
                                        DateValue(Hire_Date) = d ||
                                        DateValue(End_Date) = d
                                    )
                                )
                            )
                        )
