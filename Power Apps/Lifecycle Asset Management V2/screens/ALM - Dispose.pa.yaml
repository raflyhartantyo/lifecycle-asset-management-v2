                                                        Updated_Date:originalAsset.Updated_Date, 
                                                        Update_Type:originalAsset.Update_Type
                                                    }
                                                )
                                            )
                                        )
                                    );

                                    // 3B) Remove the original from Master_Asset (NO extra error logging)
                                    Remove(Master_Asset, originalAsset)
                                )
                            )
                        )
                    );

                    // Cleanup + UX
                    Clear(colDisposeList);
                    Clear(colTempData_Dispose_Trigger);
                    UpdateContext({ ShowDisposalLastConfirm: false });
