                        - ButtonSave_Registration_2:
                            Control: Button@0.0.45
                            Properties:
                              Icon: ="CheckmarkCircle"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |-
                                =
                                // 1) Compute totals for both collections, with rounding to 2 decimals
                                Set(
                                    varListTotal,
                                    Round(Sum(colDisposeList,Selling_Price), 2)
                                );
                                Set(
                                    varDraftTotal,
                                    Round(Sum(colTempData_Dispose_Trigger, Selling_Price), 2)
                                );

                                // 2) Compare and act
                                If(
                                    varListTotal = varDraftTotal,
                                    // ✅ Match → show success and set the last-confirm flag
                                    Concurrent(
                                        Notify(
                                            "Selling Price totals match: " & Text(varListTotal, "#,##"),
                                            NotificationType.Success
                                        ),
                                        UpdateContext({ ShowDisposalLastConfirm: true })
                                    ),
                                    // ❌ Mismatch → show red error (do not set the flag)
                                    Notify(
                                        "Mismatch: Total Dispose Value " & Text(varDraftTotal, "#,##") &
                                        " vs Total Itemized Dispose Value " & Text(varListTotal, "#,##"),
                                        NotificationType.Error
                                       )
                                );
