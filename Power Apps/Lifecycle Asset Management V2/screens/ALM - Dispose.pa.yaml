            - ButtonClose_Registration_31:
                Control: Button@0.0.45
                Properties:
                  BasePaletteColor: =Color.Red
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =50
                  Icon: ="Dismiss"
                  OnSelect: |-
                    =UpdateContext({ShowDisposalLastConfirm: false})
                  Text: ="Close"
                  Width: =200
                  X: =Parent.Width/4
                  Y: =AssetDataContainer_12.Height+AssetDataContainer_12.Y+10
            - ButtonClose_Registration_34:
                Control: Button@0.0.45
                Properties:
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =ButtonClose_Registration_31.Height
                  Icon: ="Checkmark"
                  OnSelect: |-
                    =// Loop through items to dispose
                    ForAll(
                        colDisposeList As r,

                        // Per-item correlation ID
                        With(
                            {
                                localCorrelationId: GUID(),
                                ctxNow: Now(),
                                ctxUserEmail: Lower(User().Email),
                                changedById: LookUp(Master_Employee, Email = Lower(User().Email)).MyID
                            },

                            // 1) Find the original active asset (used for deletion + audit 'Dispose')
                            With(
                                {
                                    originalAsset:
                                        LookUp(
                                            Master_Asset,
                                            Accounting_Asset_Code = r.Accounting_Asset_Code
                                        )
                                },

                                // 2) Archive to 'Inactive Assets' (NO audit for this creation)
                                Patch(
                                    'Inactive Assets',
                                    Defaults('Inactive Assets'),
                                    {
                                        Title: r.Asset_ID,
                                        Organization_ID: r.Organization_ID,
                                        Accounting_Asset_Code: r.Accounting_Asset_Code,
                                        Asset_Name: r.Asset_Name,
                                        Asset_Type_ID: r.Asset_Type_ID,
                                        Purchasing_Price: r.Purchasing_Price,
                                        Selling_Price: r.Selling_Price,
                                        Function_ID: r.Function_ID,
                                        IM_Number: r.IM_Number,
                                        Buyer_Name: r.Buyer,
                                        Dispose_Date: r.Dispose_Date,
                                        Remarks: r.Remarks
                                    }
                                );

                                // 3) If the original exists, audit (single row), write movement history, then delete
                                If(
                                    !IsBlank(originalAsset),

                                    // 3A) Build the change table from original values -> blank (deletion)
                                    With(
                                        {
                                            deleteChangeTable:
                                                Table(
                                                    { FieldName: "Asset_ID",               OldValue: Text(Coalesce(originalAsset.Asset_ID, "")),               NewValue: "" },
                                                    { FieldName: "Accounting_Asset_Code",  OldValue: Text(Coalesce(originalAsset.Accounting_Asset_Code, "")),  NewValue: "" },
                                                    { FieldName: "Asset_Name",             OldValue: Text(Coalesce(originalAsset.Asset_Name, "")),             NewValue: "" },
                                                    { FieldName: "Location_ID",            OldValue: Text(Coalesce(originalAsset.Location_ID, "")),            NewValue: "" },
                                                    { FieldName: "MYID_Asset_Owner",       OldValue: Text(Coalesce(originalAsset.MYID_Asset_Owner, "")),       NewValue: "" },
                                                    { FieldName: "MYID_Business_Owner",    OldValue: Text(Coalesce(originalAsset.MYID_Business_Owner, "")),    NewValue: "" },
                                                    { FieldName: "Asset_Type_ID",          OldValue: Text(Coalesce(originalAsset.Asset_Type_ID, "")),          NewValue: "" },
                                                    { FieldName: "Purchasing_Price",       OldValue: Text(Coalesce(originalAsset.Purchasing_Price, "")),       NewValue: "" },
                                                    { FieldName: "HostName",               OldValue: Text(Coalesce(originalAsset.HostName, "")),               NewValue: "" },
                                                    { FieldName: "Remarks",                OldValue: Text(Coalesce(originalAsset.Remarks, "")),                NewValue: "" },
                                                    { FieldName: "Asset_Condition",        OldValue: Text(Coalesce(originalAsset.Asset_Condition, "")),        NewValue: "" },
                                                    { FieldName: "Asset_Status",           OldValue: Text(Coalesce(originalAsset.Asset_Status, "")),           NewValue: "" },
                                                    { FieldName: "Lifespan",               OldValue: Text(Coalesce(originalAsset.Lifespan, "")),               NewValue: "" },
                                                    { FieldName: "Organization_ID",        OldValue: Text(Coalesce(originalAsset.Organization_ID, "")),        NewValue: "" },
                                                    { FieldName: "Function_ID",            OldValue: Text(Coalesce(originalAsset.Function_ID, "")),            NewValue: "" },
                                                    { FieldName: "Arrival_Date",           OldValue: Text(Coalesce(originalAsset.Arrival_Date, Blank()), "[$-en-US]yyyy-mm-dd"), NewValue: "" },
                                                    { FieldName: "Category_ID",            OldValue: Text(Coalesce(originalAsset.Category_ID, "")),            NewValue: "" },
                                                    { FieldName: "Updated_Date",           OldValue: Text(Coalesce(originalAsset.Updated_Date, Blank()), "[$-en-US]yyyy-mm-dd"), NewValue: "" },
                                                    { FieldName: "Update_Type",            OldValue: Text(Coalesce(originalAsset.Update_Type, "")),            NewValue: "" }
                                                )
                                        },

                                        // 3A-i) Build changesFlat once
                                        With(
                                            {
                                                changesFlat:
                                                    Concat(
                                                        deleteChangeTable,
                                                        FieldName & ":" &
                                                        Coalesce(Text(OldValue), "") & "-" &
                                                        Coalesce(Text(NewValue), "") & ","
                                                    )
                                            },

                                            // 3A-ii) Build changesText from changesFlat
                                            With(
                                                {
                                                    changesText:
                                                        "[" &
                                                        If(
                                                            Len(changesFlat) > 0,
                                                            Left(changesFlat, Len(changesFlat) - 1),
                                                            ""
                                                        ) &
                                                        "]"
                                                },

                                                // 3A-iii) Single AuditLog row for the disposal
                                                Patch(
                                                    AuditLog,
                                                    Defaults(AuditLog),
                                                    {
                                                        CorrelationID: localCorrelationId,
                                                        TargetList: "Master_Asset",
                                                        ItemId: originalAsset.ID, // change to ItemID if your column name is ItemID
                                                        ChangedBy: changedById,
                                                        ChangedOn: ctxNow,
                                                        ChangeType: "Dispose",
                                                        Changes: changesText
                                                    }
                                                );

                                                // 3A-iv) Snapshot current asset state into asset_movement_history
                                                // Map the fields you want to preserve; adjust names if the history list schema differs.
                                                Patch(
                                                    Asset_Movement_History,
                                                    Defaults(Asset_Movement_History),
                                                    {
                                                        Asset_ID: originalAsset.Asset_ID,
