            - ColumnValueMasterAsset_11:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =Color.Transparent
                  Height: =Parent.Height-50
                  Items: |+
                    =If(
                        !ShowDisposeData,
                        Blank(),
                        With(
                            {
                                q: Trim(Search_AssetMaster_4.Value),
                                // Try to parse number and date once, safely
                                n: If(IsNumeric(Search_AssetMaster_4.Value), Value(Search_AssetMaster_4.Value), Blank()),
                                d: IfError(DateValue(Search_AssetMaster_4.Value), Blank()),
                                dd: Coalesce(DropdownCanvas2_4.Selected.Value, "All")
                            },
                            If(
                                IsBlank(q),
                                Master_Asset_Data,
                                Switch(
                                    dd,
                                    // =========================
                                    // ALL FIELDS (broad search)
                                    // =========================
                                    "All",
                                    Filter(
                                        Master_Asset_Data,
                                        // text columns -> substring search with 'in'
                                        q in Asset_ID ||
                                        q in Organization_ID ||
                                        q in Accounting_Asset_Code ||
                                        q in Asset_Name ||
                                        q in MYID_Asset_Owner ||
                                        q in MYID_Business_Owner ||
                                        q in Asset_Condition ||
                                        q in Asset_Status ||
                                        q in Environment ||
                                        q in Location_ID ||
                                        q in Asset_Type_ID ||
                                        q in Category_ID ||
                                        q in HostName ||
                                        q in Merk ||
                                        q in Sub_Merk ||
                                        q in Function_ID ||
                                        q in Supplier ||
                                        q in Remarks ||
                                        // numeric columns -> exact match if q is numeric
                                        (!IsBlank(n) && (Lifespan = n || Purchasing_Price = n)) ||
                                        // date columns -> exact match if q parsed as date
                                        (!IsBlank(d) && (Arrival_Date = d || Updated_Date = d))
                                    ),
                                    // =========================
                                    // PER-DROPDOWN SELECTIONS
                                    // =========================
                                    "Asset ID",           Filter(Master_Asset_Data, q in Asset_ID),
                                    "Organization ID",    Filter(Master_Asset_Data, q in Organization_ID),
                                    "Accounting Asset Code", Filter(Master_Asset_Data, q in Accounting_Asset_Code),
                                    "Asset Name",         Filter(Master_Asset_Data, q in Asset_Name),
                                    "My ID Asset Owner",  Filter(Master_Asset_Data, q in MYID_Asset_Owner),
                                    "My ID Business Owner", Filter(Master_Asset_Data, q in MYID_Business_Owner),
                                    "Asset Condition",    Filter(Master_Asset_Data, q in Asset_Condition),
                                    "Asset Status",       Filter(Master_Asset_Data, q in Asset_Status),
                                    "Location ID",        Filter(Master_Asset_Data, q in Location_ID),
                                    "Asset Type ID",      Filter(Master_Asset_Data, q in Asset_Type_ID),
                                    "Category ID",        Filter(Master_Asset_Data, q in Category_ID),
                                    "HostName",           Filter(Master_Asset_Data, q in HostName),
                                    "Environment",        Filter(Master_Asset_Data, q in Environment),
                                    "Merk",               Filter(Master_Asset_Data, q in Merk),
                                    "Sub-Merk",           Filter(Master_Asset_Data, q in Sub_Merk),
                                    "Function ID",        Filter(Master_Asset_Data, q in Function_ID),
                                    "Supplier",           Filter(Master_Asset_Data, q in Supplier),
                                    "Remarks",            Filter(Master_Asset_Data, q in Remarks),
                                    // numeric/date choices with guards
                                    "Lifespan",           Filter(Master_Asset_Data, !IsBlank(n) && Lifespan = n),
                                    "Purchasing Price",   Filter(Master_Asset_Data, !IsBlank(n) && Purchasing_Price = n),
                                    "Arrival Date",       Filter(Master_Asset_Data, !IsBlank(d) && Arrival_Date = d),
                                    "Updated Date",       Filter(Master_Asset_Data, !IsBlank(d) && Updated_Date = d),
                                    // You had "Updated Type" mapping to Remarks earlier
                                    "Updated Type",       Filter(Master_Asset_Data, q in Remarks),
                                    // Fallback
                                    Master_Asset_Data
                                )
                            )
                        )
                    )

