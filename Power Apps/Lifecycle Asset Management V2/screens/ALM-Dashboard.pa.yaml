Screens:
  ALM-Dashboard:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Ctr_HPMD_4:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 245, 245, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutJustifyContent: =LayoutJustifyContent.Center
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
            PaddingTop: =16
            Width: =Parent.Width
          Children:
            - Ctr_HPMD_5:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =75
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =8
                  PaddingLeft: =8
                  PaddingRight: =8
                  PaddingTop: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                Children:
                  - Hdr_HPMD_1:
                      Control: Header@0.0.44
                      Properties:
                        Fill: =RGBA(180, 214, 250, 1)
                        Logo: ='Zurich Logo'
                        LogoTooltip: ="Zurich"
                        Title: ="Asset Lifecycle Management - Dashboard"
            - Ctr_HPMD_7:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  AlignInContainer: =AlignInContainer.SetByContainer
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(245, 245, 245, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =16
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  LayoutWrap: =true
                  PaddingBottom: =2
                  PaddingLeft: =2
                  PaddingRight: =2
                  PaddingTop: =2
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - PowerBI1:
                      Control: PowerBI@2.4.0
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        FillPortions: =1
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        TileUrl: ="https://app.powerbi.com/reportEmbed?reportId=<REDACTED-ID>&autoAuth=true&ctid=<REDACTED-ID>&actionBarEnabled=true"
                        Width: =
      - ButtonNew_CategoryMaster_16:
          Control: Button@0.0.45
          Properties:
            BasePaletteColor: =Color.Orange
            Height: =50
            Icon: ="ArrowClockwise"
            OnSelect: =DataRefreshALM.Run()
            Text: ="Refresh Data"
            Width: =116
            X: =Icon_Home_HPMD_1.X-150
            Y: =Icon_Home_HPMD_1.Y + (Icon_Home_HPMD_1.Height / 2) - (Self.Height / 2)
      - Icon_Home_HPMD_1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(0, 18, 107, 1)
            Height: =50
            Icon: =Icon.Home
            OnSelect: =Navigate('2_HomePage', ScreenTransition.Fade);
            Width: =50
            X: =Hdr_HPMD_1.X+Hdr_HPMD_1.Width-125
            Y: =Hdr_HPMD_1.Y + (Hdr_HPMD_1.Height / 2) - (Self.Height / 2) +15
