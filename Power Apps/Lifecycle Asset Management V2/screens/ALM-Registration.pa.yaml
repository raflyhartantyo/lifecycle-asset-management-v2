      - Registration_AttachmentControl:
          Control: Attachments@2.3.0
          Properties:
            BorderColor: =Color.Transparent
            Color: =Color.Transparent
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            Height: =80
            HoverBorderColor: =Color.Transparent
            HoverColor: =Color.Transparent
            HoverFill: =Color.Transparent
            ItemColor: =RGBA(255, 255, 255, 1)
            ItemFill: =RGBA(56, 96, 178, 1)
            ItemHoverFill: =RGBA(186, 202, 226, 1)
            MaxAttachmentSize: =100
            OnAddFile: |
              =UpdateContext({ShowSpinnerReg: true});
              UpdateContext({ Reg_Upload_output_pa: Bulk_Registration.Run({contentBytes: Last(Self.Attachments).Value,name: Last(Self.Attachments).Name}).rowsjson});
              UpdateContext({ShowSpinnerReg: false});
              UpdateContext({j:ParseJSON(Reg_Upload_output_pa)});
              UpdateContext({Asset_Category_Text: Text(j.AssetCategory)});
              ClearCollect(
                  colRegRows,
                  ForAll(
                      j As row,
                      {
                          AssetCodeText:        Text(row.AssetCode),
                          AssetDescriptionText: Text(row.AssetDescription),
                          AssetCategoryText:    Text(row.AssetCategory),
                          PurchasingPriceNum:   Value(row.PurchasingPrice),
                          HostNameText:         Text(row.HostName),
                          RemarkText:           Text(row.Remark),
                          PurchasingDateNum:    Value(row.PurchasingDate),
                          SerialNumber : Text(row.SerialNumber)
                      }
                  )
              );
              ClearCollect(colTempData_Registration, ForAll(colRegRows As row,
              {
                  Accounting_Asset_Code : Text(row.AssetCodeText),
                  Asset_Name : Text(row.AssetDescriptionText),
                  Location_ID : "LOC-01",
                  Asset_Type_ID : Text(LookUp(Master_Asset_Type, Asset_Type_Name = row.AssetCategoryText).Asset_Type_ID),
                  MYID_Asset_Owner : Text("TO.BE.ANNOUNCED"),
                  MYID_Business_Owner : If(
                  LookUp(
                      Master_Asset_Type,
                      Asset_Type_Name = row.AssetCategoryText,
                      Asset_Type_ID
                  ) in [
                      "ATP-002",
                      "ATP-004",
                      "ATP-005",
                      "ATP-012",
                      "ATP-017",
                      "ATP-019",
                      "ATP-020",
                      "ATP-006"
                  ],
                  "RAYMOND.OCTORY",
                  "FITRI.AMELIA"
              ),
                  Purchasing_Price : Value(row.PurchasingPriceNum),
                  Host_Name : Text(row.HostNameText),
                  Serial_Number : Text(row.SerialNumber),
                  Remarks: Text(row.RemarkText),
                          Condition: "Good",
                          Status: "Available",
                          Lifespan : 3, 
                          Organization_ID : First(colTempData_Registration_Trigger).Organization_ID, 
                          Function_ID : First(colTempData_Registration_Trigger).Function_ID,
                          Purchasing_Date: DateAdd(Date(1900, 1, 1), row.PurchasingDateNum  - 1, TimeUnit.Days),
                          Category_ID : LookUp(Master_Asset_Type, Asset_Type_Name = row.AssetCategoryText).Category_ID
              }));
              UpdateContext({ShowSpinnerReg: false});
              UpdateContext({ShowRegistrationLastConfirm:true})
