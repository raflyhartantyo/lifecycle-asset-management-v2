                  OnSelect: "=If(\n    \nCountRows(\n    Filter(\n        ForAll(\n            colTempData_Registration,\n            With(\n                {\n                    tempAssetCode: Accounting_Asset_Code,\n                    tempAssetType: Asset_Type_ID\n                },\n                {\n                    HasError:\n                        // Mandatory fields\n                        IsBlank(tempAssetCode) ||\n                        IsBlank(Asset_Name) ||\n                        IsBlank(tempAssetType) ||\n                        IsBlank(Purchasing_Price) ||\n                        IsBlank(Purchasing_Date) ||\n\n                        // Conditional Serial Number\n                        (\n                            tempAssetType in [\"ATP-012\", \"ATP-013\"] &&\n                            IsBlank(Serial_Number)\n                        ) ||\n\n                        // Duplicate check (Master vs Temp clearly separated)\n                        !IsBlank(\n                            LookUp(\n                                Master_Asset,\n                                Accounting_Asset_Code = tempAssetCode\n                            )\n                        )\n                }\n            )\n        ),\n        HasError\n    )\n) > 0\n\n, UpdateContext({ ShowRegistrationLastConfirm: false }); \n    \nNotify(\n    \"Please complete all mandatory fields\",\n    NotificationType.Error\n)\n,\n\n// Spinner ON\nUpdateContext({ ShowRegistrationLastSpinner: true });\n// Step — Loop registration items, create Master_Asset + AuditLog\nForAll(\n    colTempData_Registration As r,\n    // Per-item correlation ID and stable Asset_ID\n    With(\n        {\n            localCorrelationId: GUID(),\n            assetIdVal: Concatenate(\n                Text(RandBetween(0, 9999)),\n                Text(Now(), \"yyyymmddHHmmssms\")\n            ),\n            ctxNow: Now(),\n            ctxUserEmail: Lower(User().Email)\n        },\n        // 1) Create the new asset item\n        With(\n            {\n                newAsset:\n                    Patch(\n                        Master_Asset,\n                        Defaults(Master_Asset),\n                        {\n                            Asset_ID: assetIdVal,\n                            Accounting_Asset_Code: r.Accounting_Asset_Code,\n                            Asset_Name: r.Asset_Name,\n                            Location_ID: r.Location_ID,\n                            MYID_Asset_Owner: r.MYID_Asset_Owner,\n                            MYID_Business_Owner: r.MYID_Business_Owner,\n                            Asset_Type_ID: r.Asset_Type_ID,\n                            Purchasing_Price: r.Purchasing_Price,\n                            HostName: r.Host_Name,\n                            Asset_Condition: r.Condition,\n                            Asset_Status: r.Status,\n                            Lifespan: r.Lifespan,\n                            Organization_ID: r.Organization_ID,\n                            Function_ID: r.Function_ID,\n                            Arrival_Date: r.Purchasing_Date,\n                            Category_ID: r.Category_ID,\n                            Serial_Number: r.Serial_Number,\n                            Updated_Date: Today(),\n                            Update_Type: \"Registration\"\n                        }\n                    )\n            },\n            // 2) Build per-record change table for audit logging\n            With(\n                {\n                    changeTable:\n                        Table(\n                            { FieldName: \"Asset_ID\",               OldValue: \"\", NewValue: Text(assetIdVal) },\n                            { FieldName: \"Accounting_Asset_Code\",  OldValue: \"\", NewValue: r.Accounting_Asset_Code },\n                            { FieldName: \"Asset_Name\",             OldValue: \"\", NewValue: r.Asset_Name },\n                            { FieldName: \"Location_ID\",            OldValue: \"\", NewValue: Text(r.Location_ID) },\n                            { FieldName: \"MYID_Asset_Owner\",       OldValue: \"\", NewValue: Text(r.MYID_Asset_Owner) },\n                            { FieldName: \"MYID_Business_Owner\",    OldValue: \"\", NewValue: Text(r.MYID_Business_Owner) },\n                            { FieldName: \"Asset_Type_ID\",          OldValue: \"\", NewValue: Text(r.Asset_Type_ID) },\n                            { FieldName: \"Purchasing_Price\",       OldValue: \"\", NewValue: Text(r.Purchasing_Price) },\n                            { FieldName: \"HostName\",               OldValue: \"\", NewValue: r.Host_Name },\n                            { FieldName: \"Remarks\",                OldValue: \"\", NewValue: r.Remarks },\n                            { FieldName: \"Asset_Condition\",        OldValue: \"\", NewValue: r.Condition },\n                            { FieldName: \"Asset_Status\",           OldValue: \"\", NewValue: r.Status },\n                            { FieldName: \"Lifespan\",               OldValue: \"\", NewValue: Text(r.Lifespan) },\n                            { FieldName: \"Organization_ID\",        OldValue: \"\", NewValue: Text(r.Organization_ID) },\n                            { FieldName: \"Function_ID\",            OldValue: \"\", NewValue: Text(r.Function_ID) },\n                            { FieldName: \"Arrival_Date\",           OldValue: \"\", NewValue: Text(r.Purchasing_Date, \"[$-en-US]yyyy-mm-dd\") },\n                            { FieldName: \"Category_ID\",            OldValue: \"\", NewValue: Text(r.Category_ID) },\n                            { FieldName: \"Updated_Date\",           OldValue: \"\", NewValue: Text(Today(), \"[$-en-US]yyyy-mm-dd\") },\n                            { FieldName: \"Update_Type\",            OldValue: \"\", NewValue: \"Registration\" },\n                            { FieldName: \"Serial_Number\",            OldValue: \"\", NewValue: Text(r.Serial_Number) }\n                        )\n                },\n                // 3a) Build changesFlat once\n                With(\n                    {\n                        changesFlat:\n                            Concat(\n                                changeTable,\n                                FieldName & \":\" &\n                                Coalesce(Text(OldValue), \"\") & \"-\" &\n                                Coalesce(Text(NewValue), \"\") & \",\"\n                            )\n                    },\n                    // 3b) Build changesText from changesFlat\n                    With(\n                        {\n                            changesText:\n                                \"[\" &\n                                If(\n                                    Len(changesFlat) > 0,\n                                    Left(changesFlat, Len(changesFlat) - 1),\n                                    \"\"\n                                ) &\n                                \"]\"\n                        },\n                        // 4) Write ONE row to AuditLog per created asset\n                        If(\n                            !IsBlank(newAsset.ID),\n                            Patch(\n                                AuditLog,\n                                Defaults(AuditLog),\n                                {\n                                    CorrelationID: localCorrelationId,\n                                    TargetList: \"Master_Asset\",\n                                    ItemId: newAsset.ID, // change to ItemID if your column name is ItemID\n                                    ChangedBy: LookUp(Master_Employee, Email = ctxUserEmail).MyID,\n                                    ChangedOn: ctxNow,\n                                    ChangeType: \"Registration\",\n                                    Changes: changesText\n                                }\n                            )\n                        )\n                    )\n                )\n            )\n        )\n    )\n);\n// Collections cleanup\nClear(colMigrateAcctoRegis);\nClear(colTempData_Registration);\nClear(colTempData_Registration_Trigger);\n// Spinner OFF + Confirm OFF\nUpdateContext({ ShowRegistrationLastSpinner: false });\nUpdateContext({ ShowRegistrationLastConfirm: false });\n// UX\nNotify(\"Data saved successfully!\", NotificationType.Success);\nNavigate('Home Page_Transaction', ScreenTransition.Fade);\n)"
