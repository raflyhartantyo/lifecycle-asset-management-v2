            - ButtonClose_Registration_25:
                Control: Button@0.0.45
                Properties:
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =40
                  Icon: ="Save"
                  OnSelect: |
                    =If(
                        Form1_8.Valid,

                        // ---- 1) Correlation + timestamp
                        UpdateContext({
                            ctxCorrelationId: GUID(),
                            ctxNow: Now()
                        });

                        // ---- 2) ORIGINAL values (from your local edit buffer)
                        UpdateContext({
                            ctxOrig_Organization_ID: colTempEditMasterOrganization.Organization_ID,
                            ctxOrig_Organization_Name: colTempEditMasterOrganization.Organization_Name
                        });

                        // ---- 3) EDITED values (from cards)
                        UpdateContext({
                            ctxEdit_Organization_ID: Organization_ID_DataCard3.Update,
                            ctxEdit_Organization_Name: Organization_Name_DataCard1.Update
                        });

                        // ---- 4) Build change table and keep only changed fields
                        UpdateContext({
                            ctxChangesAll: Table(
                                {
                                    FieldName: "Organization_ID",
                                    OldValue: ctxOrig_Organization_ID,
                                    NewValue: ctxEdit_Organization_ID,
                                    Changed: ctxOrig_Organization_ID <> ctxEdit_Organization_ID
                                },
                                {
                                    FieldName: "Organization_Name",
                                    OldValue: ctxOrig_Organization_Name,
                                    NewValue: ctxEdit_Organization_Name,
                                    Changed: ctxOrig_Organization_Name <> ctxEdit_Organization_Name
                                }
                            )
                        });
                        UpdateContext({
                            ctxChanges: Filter(ctxChangesAll, Changed)
                        });

                        // ---- 5) Patch the master record (optional ETag for concurrency)
                        UpdateContext({
                            ctxPatchedItem:
                                Patch(
                                    Master_Organization,
                                    LookUp(Master_Organization, ID = colTempEditMasterOrganization.ID),
                                    {
                                        Organization_ID: ctxEdit_Organization_ID,
                                        Organization_Name: ctxEdit_Organization_Name
                                    }
                                )
                        });

                        // ---- 6) Build the single "Changes" string: [FieldName:OldValue-NewValue,...]
                        // Concat doesn't support a separator param; add commas manually then strip the trailing one.
                        UpdateContext({
                            ctxChangesFlat:
                                Concat(
                                    ctxChanges,
                                    FieldName & ":" &
                                    Coalesce(Text(OldValue), "") & "-" &
                                    Coalesce(Text(NewValue), "") & ","
                                )
                        });
                        UpdateContext({
                            ctxChangesText:
                                "[" &
                                If(
                                    Len(ctxChangesFlat) > 0,
                                    Left(ctxChangesFlat, Len(ctxChangesFlat) - 1),
                                    ""
                                ) &
                                "]"
                        });
                        // ---- 7) If Patch succeeded AND there are changes, write ONE AuditLog row
                        If(
                            And(
                                !IsBlank(ctxPatchedItem.ID),
                                CountRows(ctxChanges) > 0
                            ),
                            Patch(
                                AuditLog,
                                Defaults(AuditLog),
                                {
                                    CorrelationID: ctxCorrelationId,
                                    TargetList: "Master_Organization",
                                    // Use the exact internal name of your column below (ItemID vs ItemId).
                                    ItemId: ctxPatchedItem.ID,
                                    ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,
                                    ChangedOn: ctxNow,
                                    ChangeType: "Edit",
                                    Changes: ctxChangesText
                                }
                            )
                        );

                        // ---- 7) Notify & clean up
                        If(
                            !IsBlank(ctxPatchedItem.ID),
                            Notify(
                                If(CountRows(ctxChanges) = 0, "Saved (no changes detected).", "Saved and audit logged."),
                                NotificationType.Success
                            );
                            UpdateContext({ colTempEditMasterOrganization: Blank() });
                            ResetForm(Form1_8);
                            UpdateContext({ ShowFormEditMasterOrganization: false });
                            Refresh(Master_Organization);ClearCollect(colGalleryDataMasterOrganization,Master_Organization),
                            Notify(
                                "Save failed. The item may have been modified; refresh and try again.",
                                NotificationType.Error
                            )
                        ),

                        // ---- ELSE (Form not valid)
                        Notify("Please fill all required fields before submitting.", NotificationType.Error)
                    );
                  Text: ="Save"
                  Width: =120
                  X: =Parent.Width*3/4-120
                  Y: =Form1_8.Height+Form1_8.Y+10
            - ButtonClose_Registration_26:
