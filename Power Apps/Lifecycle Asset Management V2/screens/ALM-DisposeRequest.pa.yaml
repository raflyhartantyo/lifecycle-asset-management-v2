            - ButtonClose_Registration_35:
                Control: Button@0.0.45
                Properties:
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =50
                  Icon: ="Checkmark"
                  OnSelect: |+
                    =UpdateContext({ShowRegistrationLastConfirm: false});

                    ClearCollect(
                        DisposeReqItemJSON,
                        ForAll(
                            colDisposeReqList As r,
                            {
                                Asset_Code: r.Accounting_Asset_Code,
                                Asset_Name : r.Asset_Name,
                                Purchasing_Date : r.Arrival_Date,
                                Purchasing_Price : r.Purchasing_Price,
                                Book_Value : r.Book_Value,
                                Business_Owner_MYID : r.MYID_Business_Owner,
                                Business_Owner_Name : LookUp(Master_Employee, MyID = r.MYID_Business_Owner).Display_Name,
                                Business_Owner_Email : LookUp(Master_Employee, MyID = r.MYID_Business_Owner).Email,
                                Asset_Condition : r.Asset_Condition,
                                Asset_Status : r.Asset_Status
                            }
                        )
                    );


                    ClearCollect(
                        colApprovers,
                        ForAll(
                            Distinct(DisposeReqItemJSON, Business_Owner_MYID),
                            { Owner_Email: LookUp(Master_Employee, MyID = Value).Email,
                            Owner_MYID : Value
                            , Owner_Name : LookUp(Master_Employee, MyID = Value).Display_Name, Status: "Pending", RespondedAt: "" }
                        )
                    );


                    Patch(
                        'Disposal Request', // your list
                        Defaults('Disposal Request'),
                        {
                            Title: GUID(),
                            Overall_Status: Concatenate("Pending ", CountRows(colApprovers), " Approvers"),
                            Request_Name: "Disposal Request " & Text(Now(), "[$-en-US]yyyymmdd_hhmmss"),
                            Created_By: User().Email,
                            Item_Details: JSON(DisposeReqItemJSON, JSONFormat.IndentFour),
                            Approvers: JSON(colApprovers, JSONFormat.IndentFour)
                        }
                    );
                    Clear(DisposeReqItemJSON);
                    Clear(colDisposeReqList);
                    Clear(colApprovers);
                    UpdateContext({SelectDisposeItem:false})

