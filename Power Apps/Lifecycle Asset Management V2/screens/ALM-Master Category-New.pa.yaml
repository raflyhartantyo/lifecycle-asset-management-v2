                        - ButtonSave_CategoryMaster_New_1:
                            Control: Button@0.0.45
                            Properties:
                              Icon: ="Save"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: |
                                =
                                // Step 1 — Global context for this save run
                                UpdateContext({
                                    ctxUserDisplay: User().FullName,
                                    ctxUserEmail: Lower(User().Email),
                                    ctxNow: Now()
                                });

                                // Step 2 — Loop through collection and patch each new record
                                ForAll(
                                    colTempData_CategoryMaster As r,

                                    // Per-item correlation ID (valid inside ForAll using With)
                                    With(
                                        { localCorrelationId: GUID() },

                                        // 1) Create the new master item
                                        With(
                                            {
                                                newItem:
                                                    Patch(
                                                        Master_Category,
                                                        Defaults(Master_Category),
                                                        {
                                                            Category_ID: r.Category_ID,
                                                            Category_Accounting_Name: r.Category_Accounting_Name,
                                                            Category_Name: r.Category_Name,
                                                            Category_Description: r.Category_Desc
                                                        }
                                                    )
                                            },

                                            // 2) Build a per-record change table
                                            With(
                                                {
                                                    changeTable:
                                                        Table(
                                                            {
                                                                FieldName: "Category_ID",
                                                                OldValue: "",
                                                                NewValue: Text(r.Category_ID)
                                                            },
                                                            {
                                                                FieldName: "Category_Accounting_Name",
                                                                OldValue: "",
                                                                NewValue: r.Category_Accounting_Name
                                                            },
                                                            {
                                                                FieldName: "Category_Name",
                                                                OldValue: "",
                                                                NewValue: r.Category_Name
                                                            },
                                                            {
                                                                FieldName: "Category_Description",
                                                                OldValue: "",
                                                                NewValue: r.Category_Desc
                                                            }
                                                        )
                                                },

                                               // 3a) WITH #1 — build changesFlat once
                                                With(
                                                    {
                                                        changesFlat:
                                                            Concat(
                                                                changeTable,
                                                                FieldName & ":" &
                                                                Coalesce(Text(OldValue), "") & "-" &
                                                                Coalesce(Text(NewValue), "") & ","
                                                            )
                                                    },
                                                    // 3b) WITH #2 — build changesText from changesFlat
                                                    With(
                                                        {
                                                            changesText:
                                                                "[" &
                                                                If(
                                                                    Len(changesFlat) > 0,
                                                                    Left(changesFlat, Len(changesFlat) - 1),
                                                                    ""
                                                                ) &
                                                                "]"
                                                        },
                                                        // 4) Write ONE row to AuditLog per created item
                                                        If(
                                                            !IsBlank(newItem.ID),
                                                            Patch(
                                                                AuditLog,
                                                                Defaults(AuditLog),
                                                                {
                                                                    CorrelationID: localCorrelationId,
                                                                    TargetList: "Master_Category",
                                                                    // Ensure this matches your column's display/internal name
                                                                    ItemId: newItem.ID,
                                                                    ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,
                                                                    ChangedOn: ctxNow,
                                                                    ChangeType: "Created",
                                                                    Changes: changesText
                                                                }
                                                            )
                                                        )
                                                    )
                                                )
                                            )
                                        )
                                    )
                                );

                                // Post save cleanup
                                Clear(colTempData_CategoryMaster);
                                Notify("Data saved and audit logged!", NotificationType.Success);
                                Navigate('ALM - Master Category', ScreenTransition.Fade);
