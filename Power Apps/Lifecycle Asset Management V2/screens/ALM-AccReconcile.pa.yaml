      - Registration_AttachmentControl_1:
          Control: Attachments@2.3.0
          Properties:
            BorderColor: =Color.Transparent
            Color: =Color.Transparent
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            Height: =80
            HoverBorderColor: =Color.Transparent
            HoverColor: =Color.Transparent
            HoverFill: =Color.Transparent
            ItemColor: =RGBA(255, 255, 255, 1)
            ItemFill: =RGBA(56, 96, 178, 1)
            ItemHoverFill: =RGBA(186, 202, 226, 1)
            MaxAttachmentSize: =100
            OnAddFile: |-
              =UpdateContext({ShowRegistrationLastSpinner: true});
              UpdateContext({timerrepeat:true});
              UpdateContext({starttimer: true});
              UpdateContext({ Acc_Upload_job: Accounting_ReconsiliationV3.Run({contentBytes: Last(Self.Attachments).Value,name: Last(Self.Attachments).Name})});
              UpdateContext({Job_ID : Acc_Upload_job.jobid});
              UpdateContext({Acc_Status : Acc_Upload_job.status});
              Clear(Acc_Result)
            PaddingBottom: =5
            PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
            PaddingRight: =5
            PaddingTop: =5
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            Size: =10
            Tooltip: =
            Width: =120
            X: =994
      - Timer1:
          Control: Timer@2.1.0
          Properties:
            AutoStart: =true
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =Color.Transparent
            DisabledBorderColor: =ColorFade(Self.BorderColor, 70%)
            DisabledColor: =ColorFade(Self.Fill, 90%)
            DisabledFill: =ColorFade(Self.Fill, 70%)
            Duration: =10000
            Fill: =Color.Transparent
            Font: =Font.'Open Sans'
            Height: =ButtonUpload_Registration_1.Height
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnTimerEnd: |-
              =ClearCollect(
                  Acc_Result,
                  Filter(Temp_Acc_Reconcile, Title = Job_ID, Status = "Completed")
              );
              If(CountRows(Acc_Result)>0,
              UpdateContext({timerrepeat: false});
              UpdateContext({ShowRegistrationLastConfirm:true});
              UpdateContext({ShowRegistrationLastSpinner: false});
              UpdateContext({Acc_Status : LookUp(Temp_Acc_Reconcile, Title = Job_ID).Status});
              UpdateContext({Difference : LookUp(Temp_Acc_Reconcile, Title = Job_ID).Differences});
              UpdateContext({NewAssetLatest : LookUp(Temp_Acc_Reconcile, Title = Job_ID).NewAssetLatestMonth});
              UpdateContext({Month_Recon : Now()});
              UpdateContext({ParsedNewAssetLatest : ParseJSON(NewAssetLatest)});
              // 3) Build a typed collection from the array
              ClearCollect(
                  colNewAssetLatest,
                  ForAll(
                      Table(ParsedNewAssetLatest),                         // Table() iterates an untyped JSON array
                      With(
                          { r: ThisRecord.Value },            // r is the current object in the array
                          {
                              // Coerce each field to the right type
                              Asset_Code: Concatenate(Text(r.'Asset Class'),"-",Text(r.'Asset')),
                              Capitalized_On : DateAdd(Date(0, 1, 0), Value(Text(r.'Capitalized on')),TimeUnit.Days),
                              Asset_Name:  Text(r.'Asset Description'),
                              Purchasing_Price: Value(Text(r.'Acquis_x002e_val_x002e_')),
                              Quantity: Value(Text(r.Qty)),
                              Book_Value: Value(Text(r.'Book val_x002e_'))
                          }
                      )
                  )
              );

              UpdateContext({ParsedDifference : ParseJSON(Difference)});
              ClearCollect(
                  colDifference,
                  ForAll(Table(ParsedDifference),ThisRecord.Value)
              ),
              Clear(Acc_Result)
              );



              ClearCollect(
                  Acc_Failed,
                  Filter(
                      Temp_Acc_Reconcile,
                      Title = Job_ID && Status = "Failed"
                  )
              );
              If(CountRows(Acc_Failed)>0,
              UpdateContext({timerrepeat: false});
              UpdateContext({ShowRegistrationLastSpinner: false});
              UpdateContext({Failed_Log : LookUp(Temp_Acc_Reconcile, Title = Job_ID).ErrorDetails});
              Notify("Flow failed, please check run history to see details", NotificationType.Error);
              UpdateContext({Job_ID:Blank()});
              Clear(colNewAssetLatest);
              Clear(Acc_Result);
              Reset(Registration_AttachmentControl_1);,
              Clear(Acc_Failed))
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Repeat: =timerrepeat
            Start: =starttimer
            Width: =ButtonUpload_Registration_1.Width
            X: =ButtonUpload_Registration_1.X-Self.Width-50
            Y: |+
              =ButtonUpload_Registration_1.Y
