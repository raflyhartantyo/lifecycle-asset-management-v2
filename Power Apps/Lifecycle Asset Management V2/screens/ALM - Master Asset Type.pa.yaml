                        ctxEdit_AssetTypeID: Asset_Type_ID_DataCard2.Update,
                        ctxEdit_AssetTypeName: Asset_Type_Name_DataCard2.Update,
                        ctxEdit_FunctionID: Function_ID_DataCard2.Update,
                        ctxEdit_CategoryID: Category_ID_DataCard3.Update
                    });
                    // ---- 4) Build a 4-row comparison table, then keep only changed fields
                    UpdateContext({
                        ctxChangesAll: Table(
                            {
                                FieldName: "Asset_Type_ID",
                                OldValue: ctxOrig_AssetTypeID,
                                NewValue: ctxEdit_AssetTypeID,
                                Changed: ctxOrig_AssetTypeID <> ctxEdit_AssetTypeID
                            },
                            {
                                FieldName: "Asset_Type_Name",
                                OldValue: ctxOrig_AssetTypeName,
                                NewValue: ctxEdit_AssetTypeName,
                                Changed: ctxOrig_AssetTypeName <> ctxEdit_AssetTypeName
                            },
                            {
                                FieldName: "Function_ID",
                                OldValue: ctxOrig_FunctionID,
                                NewValue: ctxEdit_FunctionID,
                                Changed: ctxOrig_FunctionID <> ctxEdit_FunctionID
                            },
                            {
                                FieldName: "Category_ID",
                                OldValue: ctxOrig_CategoryID,
                                NewValue: ctxEdit_CategoryID,
                                Changed: ctxOrig_CategoryID <> ctxEdit_CategoryID
                            }
                        )
                    });
                    UpdateContext({
                        ctxChanges: Filter(ctxChangesAll, Changed)
                    });
                    // ---- 5) Patch the master list with optimistic concurrency (ETag)
                    // Note: All four are TEXT columns per your confirmation.
                    UpdateContext({
                        ctxPatchedItem:
                            Patch(
                                Master_Asset_Type,
                                LookUp(Master_Asset_Type, ID = colTempEditMasterAssetType.ID),
                                {
                                    Asset_Type_ID: ctxEdit_AssetTypeID,
                                    Asset_Type_Name: ctxEdit_AssetTypeName,
                                    Function_ID: ctxEdit_FunctionID,
                                    Category_ID: ctxEdit_CategoryID
                                }
                            )
                    });
                    // ---- 6) Build the single "Changes" string: [FieldName:OldValue-NewValue,...]
                        // Concat doesn't support a separator param; add commas manually then strip the trailing one.
                        UpdateContext({
                            ctxChangesFlat:
                                Concat(
                                    ctxChanges,
                                    FieldName & ":" &
                                    Coalesce(Text(OldValue), "") & "-" &
                                    Coalesce(Text(NewValue), "") & ","
                                )
                        });
                        UpdateContext({
                            ctxChangesText:
                                "[" &
                                If(
                                    Len(ctxChangesFlat) > 0,
                                    Left(ctxChangesFlat, Len(ctxChangesFlat) - 1),
                                    ""
                                ) &
                                "]"
                        });

                        // ---- 7) If Patch succeeded AND there are changes, write ONE AuditLog row
                        If(
                            And(
                                !IsBlank(ctxPatchedItem.ID),
                                CountRows(ctxChanges) > 0
                            ),
                            Patch(
                                AuditLog,
                                Defaults(AuditLog),
                                {
                                    CorrelationID: ctxCorrelationId,
                                    TargetList: "Master_Asset_Type",
                                    // Use the exact internal name of your column below (ItemID vs ItemId).
                                    ItemId: ctxPatchedItem.ID,
                                    ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,
                                    ChangedOn: ctxNow,
                                    ChangeType: "Edit",
                                    Changes: ctxChangesText
                                }
                            )
                        );
                    // ---- 7) Notify outcome
                    If(
                        !IsBlank(ctxPatchedItem.ID),
                        Notify(
                            If(CountRows(ctxChanges) = 0, "Saved (no changes detected).", "Saved and audit logged."),
                            NotificationType.Success
                        );
                        UpdateContext({colTempEditMasterAssetType:Blank()});
                        ResetForm(Form1_2);
                        UpdateContext({ShowFormEditMasterAssetType: false});
                        ,
                        Notify("Save failed. The item may have been modified; refresh and try again.", NotificationType.Error)
                    ); Refresh(Master_Asset_Type);ClearCollect(colGalleryDataMasterAssetType,Master_Asset_Type),
                    Notify("Please fill all required fields before submitting.", NotificationType.Error));
                  Text: ="Save"
