                        - ButtonSave_CategoryMaster_New:
                            Control: Button@0.0.45
                            Properties:
                              Icon: ="Save"
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              OnSelect: "=// Step 1 — Global context for this save run\nUpdateContext({\n    ctxAppName: \"Master Data App\",\n    ctxUserDisplay: User().FullName,\n    ctxUserEmail: Lower(User().Email),\n    ctxNow: Now()\n});\n\n// Step 2 — Loop through collection and patch each new record\nForAll(\n    colTempData_MasterAssetType As r,\n\n    // Per-item correlation ID\n    With(\n        { localCorrelationId: GUID() },\n\n        // 1) Create the new master item\n        With(\n            {\n                newItem:\n                    Patch(\n                        Master_Asset_Type,\n                        Defaults(Master_Asset_Type),\n                        {\n                            Asset_Type_ID: r.Asset_Type_ID,\n                            Asset_Type_Name: r.Asset_Type_Name,\n                            Function_ID: r.Function,\n                            Category_ID: r.Category\n                        }\n                    )\n            },\n\n            // 2) Build a \"per-record\" change table (allowed inside ForAll only via With/Table)\n            With(\n                {\n                    changeTable:\n                        Table(\n                            {\n                                FieldName: \"Asset_Type_ID\",\n                                OldValue: \"\",\n                                NewValue: Text(r.Asset_Type_ID)\n                            },\n                            {\n                                FieldName: \"Asset_Type_Name\",\n                                OldValue: \"\",\n                                NewValue: r.Asset_Type_Name\n                            },\n                            {\n                                FieldName: \"Function_ID\",\n                                OldValue: \"\",\n                                NewValue: r.Function\n                            },\n                            {\n                                FieldName: \"Category_ID\",\n                                OldValue: \"\",\n                                NewValue: r.Category\n                            }\n                        )\n                },\n\n                \n\n\n\n// 3a) WITH #1 — build changesFlat once\n                With(\n                    {\n                        changesFlat:\n                            Concat(\n                                changeTable,\n                                FieldName & \":\" &\n                                Coalesce(Text(OldValue), \"\") & \"-\" &\n                                Coalesce(Text(NewValue), \"\") & \",\"\n                            )\n                    },\n\n                    // 3b) WITH #2 — build changesText from changesFlat\n                    With(\n                        {\n                            changesText:\n                                \"[\" &\n                                If(\n                                    Len(changesFlat) > 0,\n                                    Left(changesFlat, Len(changesFlat) - 1),\n                                    \"\"\n                                ) &\n                                \"]\"\n                        },\n\n                        // 4) Write ONE row to AuditLog per created item\n                        If(\n                            !IsBlank(newItem.ID),\n                            Patch(\n                                AuditLog,\n                                Defaults(AuditLog),\n                                {\n                                    CorrelationID: localCorrelationId,\n                                    TargetList: \"Master_Asset_Type\",\n                                    // Ensure this matches your column's display/internal name\n                                    ItemId: newItem.ID,\n                                    ChangedBy: LookUp(Master_Employee, Email = User().Email).MyID,\n                                    ChangedOn: ctxNow,\n                                    ChangeType: \"Created\",\n                                    Changes: changesText\n                                }\n                            )\n                        )\n                    )\n                )\n            )\n        )\n    )\n);\n\n\n\n\n// Post save cleanup\nClear(colTempData_MasterAssetType);\nNotify(\"Data saved and audit logged!\", NotificationType.Success);\nNavigate('ALM - Master Asset Type', ScreenTransition.Fade);\n"
                              Text: ="Save"
