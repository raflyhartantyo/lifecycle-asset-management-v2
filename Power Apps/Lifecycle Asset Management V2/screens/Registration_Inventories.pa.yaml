            - ButtonClose_Registration_4:
                Control: Button@0.0.45
                Properties:
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =ButtonClose_Registration_3.Height
                  Icon: ="Checkmark"
                  OnSelect: "=If(\n    \nCountRows(\n    Filter(\n        ForAll(\n            colTempDataInventories,\n            With(\n                {\n                    tempAssetCode: Text(GUID),\n                    tempAssetType: Category\n                },\n                {\n                    HasError:\n                        // Mandatory fields\n                        IsBlank(tempAssetCode) ||\n                        IsBlank(Item_Name) ||\n                        IsBlank(tempAssetType) ||\n                        IsBlank(Quantity) ||\n                        IsBlank(Location) ||\n\n                        // Duplicate check (Master vs Temp clearly separated)\n                        !IsBlank(\n                            LookUp(\n                                Master_Inventories,\n                                Title = tempAssetCode\n                            )\n                        )\n                }\n            )\n        ),\n        HasError\n    )\n) > 0\n\n\n\n\n, UpdateContext({ ShowRegistrationLastConfirm: false }); \n    \nNotify(\n    \"Please complete all mandatory fields\",\n    NotificationType.Error\n)\n,\n\n// Spinner ON\nUpdateContext({ ShowRegistrationLastSpinner: true });\n// Step — Loop registration items, create Master_Asset + AuditLog\nForAll(\n    colTempDataInventories As r,\n    // Per-item correlation ID and stable Asset_ID\n    With(\n        {\n            localCorrelationId: GUID(),\n            assetIdVal: Concatenate(\n                Text(RandBetween(0, 9999)),\n                Text(Now(), \"yyyymmddHHmmssms\")\n            ),\n            ctxNow: Now(),\n            ctxUserEmail: Lower(User().Email)\n        },\n        // 1) Create the new asset item\n        With(\n            {\n                newAsset:\n                    Patch(\n                        Master_Inventories,\n                        Defaults(Master_Inventories),\n                        {\n                            Title: r.GUID,\n                            Item_Name: r.Item_Name,\n                            Category: r.Category,\n                            Location: r.Location,\n                            Employee_MYID: r.MYID_Employee,\n                            Quantity: r.Quantity,\n                            Remarks: r.Remarks,\n                            Update_Date: Today(),\n                            Update_Type: \"Registration\"\n                        }\n                    ),\n                \n                History :\n                    Patch(\n                        Inventories_Movement_History,\n                        Defaults(Inventories_Movement_History),\n                        {\n                            Title: r.GUID,\n                            Item_Name: r.Item_Name,\n                            Category: r.Category,\n                            Location: r.Location,\n                            Employee_MYID: r.MYID_Employee,\n                            Quantity: r.Quantity,\n                            Remarks: r.Remarks,\n                            Updated_Date: Today(),\n                            Update_Type: \"Registration\"\n                        }\n                    )\n\n            },\n            // 2) Build per-record change table for audit logging\n            With(\n                {\n                    changeTable:\n                        Table(\n                            { FieldName: \"Asset_ID\",               OldValue: \"\", NewValue: Text(assetIdVal) },\n                            { FieldName: \"Asset_Name\",             OldValue: \"\", NewValue: r.Item_Name },\n                            { FieldName: \"Location_ID\",            OldValue: \"\", NewValue: Text(r.Location) },\n                            { FieldName: \"MYID_Asset_Owner\",       OldValue: \"\", NewValue: Text(r.MYID_Employee) },\n                            { FieldName: \"Asset_Type_ID\",          OldValue: \"\", NewValue: Text(r.Category) },\n                            { FieldName: \"Remarks\",                OldValue: \"\", NewValue: r.Remarks },\n                            { FieldName: \"Quantity\",                OldValue: \"\", NewValue: r.Quantity },\n                            { FieldName: \"Updated_Date\",           OldValue: \"\", NewValue: Text(Today(), \"[$-en-US]yyyy-mm-dd\") },\n                            { FieldName: \"Update_Type\",            OldValue: \"\", NewValue: \"Registration\" },\n                            { FieldName: \"Type\",            OldValue: \"\", NewValue: \"Inventories\" }\n                        )\n                },\n                // 3a) Build changesFlat once\n                With(\n                    {\n                        changesFlat:\n                            Concat(\n                                changeTable,\n                                FieldName & \":\" &\n                                Coalesce(Text(OldValue), \"\") & \"-\" &\n                                Coalesce(Text(NewValue), \"\") & \",\"\n                            )\n                    },\n                    // 3b) Build changesText from changesFlat\n                    With(\n                        {\n                            changesText:\n                                \"[\" &\n                                If(\n                                    Len(changesFlat) > 0,\n                                    Left(changesFlat, Len(changesFlat) - 1),\n                                    \"\"\n                                ) &\n                                \"]\"\n                        },\n                        // 4) Write ONE row to AuditLog per created asset\n                        If(\n                            !IsBlank(newAsset.ID),\n                            Patch(\n                                AuditLog,\n                                Defaults(AuditLog),\n                                {\n                                    CorrelationID: localCorrelationId,\n                                    TargetList: \"Master_Inventories\",\n                                    ItemId: newAsset.ID, // change to ItemID if your column name is ItemID\n                                    ChangedBy: LookUp(Master_Employee, Email = ctxUserEmail).MyID,\n                                    ChangedOn: ctxNow,\n                                    ChangeType: \"Registration\",\n                                    Changes: changesText\n                                }\n                            )\n                        )\n                    )\n                )\n            )\n        )\n    )\n);\n// Collections cleanup\nClear(colTempDataInventories);\n// Spinner OFF + Confirm OFF\nUpdateContext({ ShowRegistrationLastSpinner: false });\nUpdateContext({ ShowRegistrationLastConfirm: false });\n// UX\nNotify(\"Data saved successfully!\", NotificationType.Success);\nNavigate('Home Page_Asset_Inventory', ScreenTransition.Fade);\n)"
