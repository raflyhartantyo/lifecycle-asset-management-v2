                Control: Button@0.0.45
                Properties:
                  BasePaletteColor: =If(IsSelectedApprovalRequest=true,Color,Color.Gray)
                  BorderRadiusBottomLeft: =8
                  BorderRadiusBottomRight: =8
                  BorderRadiusTopLeft: =8
                  BorderRadiusTopRight: =8
                  Height: =ButtonClose_Registration_51.Height
                  Icon: ="Checkmark"
                  Layout: ='ButtonCanvas.Layout'.TextOnly
                  OnSelect: |-
                    =UpdateContext({IsSelectedSOResponse: false});
                    UpdateContext({IsSelectedApprovalRequest: true});
                  Text: ="Approval Details"
                  Width: =ButtonClose_Registration_51.Width
                  X: =ButtonClose_Registration_51.X+ButtonClose_Registration_51.Width
                  Y: =ButtonClose_Registration_51.Y
            - ButtonCanvas1_6:
                Control: Button@0.0.45
                Properties:
                  BasePaletteColor: =Color
                  DisplayMode: |-
                    =With(
                        {
                            userRow: LookUp(
                                colApprovers,
                                Lower(Email) = Lower(User().Email)
                            )
                        },
                        If(
                            IsBlank(userRow) ||
                            userRow.Status = "Approve" ||
                            Lower(userRow.Role) <> "respondents",
                            DisplayMode.Disabled,
                            DisplayMode.Edit
                        )
                    )
                  Icon: ="Checkmark"
                  Layout: ='ButtonCanvas.Layout'.IconBefore
                  OnSelect: |-
                    =Refresh(Temp_Stock_Opname);
                    ClearCollect(colGalleryDataSOResponseConfirm, Temp_Stock_Opname);

                    ClearCollect(
                        colAvailableAssetsSOConfirm,
                        With(
                            {
                                userAccess: LookUp(
                                    colApprovers,
                                    Lower(Email) = Lower(User().Email)
                                )
                            },
                            Filter(
                                ForAll(
                                    Table(
                                        ParseJSON(
                                            LookUp(
                                                colGalleryDataSOResponseConfirm,
                                                Title = locselecteditem.Title
                                            ).Available_Assets
                                        )
                                    ),
                                    With(
                                        { r: ThisRecord.Value },
                                        {
                                            Accounting_Asset_Code: Text(r.Accounting_Asset_Code),
                                            Confirmed: Text(r.Confirmed),
                                            SO_Comments: Text(r.SO_Comments),
                                            Asset_Type_ID: Text(r.Asset_Type_ID)
                                        }
                                    )
                                ),
                                !IsBlank(userAccess) &&
                                (
                                    /* ✅ Access = All → get everything */
                                    userAccess.Access = "All" ||

                                    /* ✅ Data Center access */
                                    (
                                        userAccess.Access = "Data Center" &&
                                        Asset_Type_ID in [
                                            "ATP-020",
                                            "ATP-012",
                                            "ATP-019",
                                            "ATP-004",
                                            "ATP-025",
                                            "ATP-005",
                                            "ATP-017"
                                        ]
                                    ) ||

                                    /* ✅ Service Management access */
                                    (
                                        userAccess.Access = "Service Management" &&
                                        Asset_Type_ID in [
                                            "ATP-013",
                                            "ATP-010",
                                            "ATP-016",
                                            "ATP-003",
                                            "ATP-018"
                                        ]
                                    )
                                )
                            )
                        )
                    );

                    If(
                        CountIf(
                            colAvailableAssetsSOConfirm,
                            Confirmed = "None"
                                || (Confirmed = "false" && IsBlank(Trim(SO_Comments)))
                        ) > 0,
                        Notify(
                            "Please save your latest changes before submitting. Also ensure all assets are confirmed and rejected assets contain SO Comments.",
                            NotificationType.Error
                        ), 
                        SO_Respondents_Confirm.Run(User().Email, Now(), locselecteditem.Title);
