                        OnSelect: |
                          =
                          // ── Step 1: Show loading state ──────────────────────────────
                          UpdateContext({locIsSaving: true});
                          // ── Step 2: InTune flow (LEFT) ──────────────────────────────
                          If(
                              !IsEmpty(Registration_AttachmentControl_2.Attachments),
                              Set(
                                  varInTuneResult,
                                  InTuneFlow.Run({contentBytes: Last(Registration_AttachmentControl_2.Attachments).Value,name: Last(Registration_AttachmentControl_2.Attachments).Name})
                              )
                          );
                          // ── Step 3: CMDB flow (MIDDLE) ──────────────────────────────
                          If(
                              !IsEmpty(Registration_AttachmentControl_3.Attachments),
                              Set(
                                  varCMDBResult,
                                  InTuneFlow.Run({contentBytes: Last(Registration_AttachmentControl_3.Attachments).Value,name: Last(Registration_AttachmentControl_3.Attachments).Name})
                              )
                          );
                          // ── Step 4: Networking Device flow (RIGHT) ──────────────────
                          If(
                              !IsEmpty(Registration_AttachmentControl_4.Attachments),
                              Set(
                                  varNetworkingResult,
                                  FlowNetworkingDevice.Run({contentBytes: Last(Registration_AttachmentControl_4.Attachments).Value,name: Last(Registration_AttachmentControl_4.Attachments).Name})
                              )
                          );
                          // ── Step 5: Done ─────────────────────────────────────────────
                          UpdateContext({locIsSaving: false});
                          Notify("Files submitted! Processing will complete within 10 minutes.", NotificationType.Success);
                          Reset(Registration_AttachmentControl_2);
                          Reset(Registration_AttachmentControl_3); 
                          Reset(Registration_AttachmentControl_4);
                          UpdateContext({ShowSOUpload:false})
